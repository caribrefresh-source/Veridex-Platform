---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: veridex-deny-wildcard-roles
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles"]
  validations:
    - expression: >-
        !has(object.rules) || object.rules.all(rule,
          (!has(rule.verbs) || !rule.verbs.exists(value, value == '*')) &&
          (!has(rule.apiGroups) || !rule.apiGroups.exists(value, value == '*')) &&
          (!has(rule.resources) || !rule.resources.exists(value, value == '*')) &&
          (!has(rule.resourceNames) || !rule.resourceNames.exists(value, value == '*')))
      message: Wildcards are forbidden in workload-namespace Roles.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: veridex-deny-wildcard-roles
spec:
  policyName: veridex-deny-wildcard-roles
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: veridex.io/data-classification
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: veridex-deny-privileged-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  validations:
    - expression: >-
        object.roleRef.kind != 'ClusterRole' ||
        object.roleRef.name == 'view'
      message: RoleBindings to cluster-admin or unapproved ClusterRoles are forbidden.
    - expression: >-
        !has(object.subjects) || object.subjects.all(subject,
          subject.kind != 'ServiceAccount' ||
          !has(subject.namespace) ||
          subject.namespace == request.namespace)
      message: Cross-namespace ServiceAccount subjects are forbidden in workload RoleBindings.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: veridex-deny-privileged-rolebindings
spec:
  policyName: veridex-deny-privileged-rolebindings
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: veridex.io/data-classification
          operator: Exists
