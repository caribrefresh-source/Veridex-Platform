# Alertmanager v0.34.0, digest-pinned for linux/amd64 (verified against
# Docker Hub 2026-09-15).
#
# Known limitation (disclosed, not fixed here): no external notification
# channel (Slack/email/PagerDuty) is authorized or configured yet. The
# "null" receiver means "received" is proven by the alert appearing in
# Alertmanager's own API/UI, not by a page reaching a human. Wiring a real
# receiver needs its own credential and its own authorization -- out of
# scope for this gate.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    # Severity model (docs/architecture/observability-catalogue.md §7):
    #   P0 data loss, tenant-boundary breach, total outage, quorum loss
    #   P1 major degradation likely to breach an SLO
    #   P2 capacity/backup/reliability risk needing same-day action
    #   P3 change, unusual event, optimisation opportunity
    #
    # The receivers are deliberately no-op today: no external notification
    # channel (Slack/email/PagerDuty) is approved or configured, and wiring
    # one needs its own credential and authorization. They are kept SEPARATE
    # rather than collapsed into a single null sink so the routing tree is
    # real and testable now -- adding a channel later is one block per tier,
    # not a redesign. Until then a firing alert is visible in Alertmanager's
    # own API and UI, which is what Gate 11 proves.
    route:
      receiver: default
      group_by: ["alertname", "class"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Page-worthy: short group_wait so nothing sits batching, and a tight
        # repeat so an unacknowledged outage keeps asserting itself.
        - matchers: ['severity="P0"']
          receiver: page
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 30m
          continue: false
        - matchers: ['severity="P1"']
          receiver: ops-urgent
          group_wait: 15s
          group_interval: 2m
          repeat_interval: 1h
        # Same-day, not same-minute: batch harder, repeat rarely.
        - matchers: ['severity="P2"']
          receiver: ops
          group_wait: 2m
          group_interval: 10m
          repeat_interval: 12h
        - matchers: ['severity="P3"']
          receiver: review
          group_wait: 5m
          group_interval: 30m
          repeat_interval: 24h

    # Suppress dependent noise: when a node is down, its disk/capacity and
    # per-container alerts are consequences, not independent findings.
    inhibit_rules:
      - source_matchers: ['alertname="NodeNotReady"']
        target_matchers: ['class=~"disk|capacity"']
        equal: ["node"]
      # A higher severity for the same alert on the same object suppresses
      # the lower one, so one problem pages once.
      - source_matchers: ['severity="P0"']
        target_matchers: ['severity=~"P1|P2|P3"']
        equal: ["alertname", "class"]
      - source_matchers: ['severity="P1"']
        target_matchers: ['severity=~"P2|P3"']
        equal: ["alertname", "class"]

    receivers:
      - name: default
      - name: page
      - name: ops-urgent
      - name: ops
      - name: review
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      serviceAccountName: alertmanager
      containers:
        - name: alertmanager
          image: "prom/alertmanager:v0.34.0@sha256:268d4bf0e4bc0fe6dbdef6a59ce81a2918c88458bf8edf7dd0572ad372a093e6"
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        # Alert state only (dedup/silence/notification log), not a system of
        # record -- ephemeral is acceptable, no hostPath needed.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
