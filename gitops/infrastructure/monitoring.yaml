---
# Gate 11 (baseline observability): VictoriaMetrics (vmsingle/vmagent/vmalert)
# + Alertmanager + node-exporter + kube-state-metrics + Loki/Fluent Bit, all
# raw pinned manifests under kubernetes/infrastructure/monitoring/ -- same
# GitOps pattern as gitops/infrastructure/traefik.yaml. Deployed into its own
# `monitoring` namespace defined by manifests/namespaces/monitoring
# namespace.yaml in the same source directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: veridex
  source:
    repoURL: https://github.com/caribrefresh-source/Veridex-Platform.git
    targetRevision: main
    # No `directory: {recurse: false}` stanza: recurse defaults to false, and
    # because false is the zero value the API server drops the whole
    # `directory` key from the stored object. Declaring it in Git therefore
    # creates a diff (Git has the key, live does not) that Argo CD can never
    # resolve -- the parent app-of-apps sits permanently OutOfSync and stops
    # converging. Found live on the traefik Application, which had exactly
    # this stanza and blocked root from applying this file at all.
    path: kubernetes/infrastructure/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
