---
# The one AppProject every Application in this repo belongs to.
#
# sourceRepos is this repo only -- Argo CD refuses to sync an Application
# whose repoURL is not listed here, so a compromised or mistaken Application
# spec cannot pull from an arbitrary Git host.
#
# destinations is restricted to this cluster's own in-cluster API server
# (never an external/attacker-registered cluster Secret -- the plan's
# "unrestricted destinations" stop condition). Namespace stays '*' within
# that one server: Gate 10 closes before every namespace name used by later
# rollout waves has been enumerated (that enumeration is Gate 32, which the
# plan explicitly places after GitOps exists to manage it). Narrow this list
# once Gate 32 closes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: veridex
  namespace: argocd
spec:
  description: The single project every Veridex-Platform Application belongs to.
  sourceRepos:
    - https://github.com/caribrefresh-source/Veridex-Platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Only what a specific, justified need has required is pre-approved here --
  # Gate 10's own rule: "a later gate that genuinely needs one extends this
  # list explicitly, not by default."
  #   - Namespace: Gate 10's own gap-closure note schedules namespace
  #     enumeration (Gate 32) for "once GitOps can manage manifests" --
  #     implying future namespaces are Argo-managed, unlike the argocd
  #     namespace itself (Ansible's sole bootstrap exception).
  #   - CustomResourceDefinition, ClusterRole, ClusterRoleBinding: added for
  #     the pinned Traefik ingress controller (kubernetes/infrastructure/ingress/)
  #     -- Traefik ships its own CRDs (IngressRoute, IngressRouteTCP, ...) and
  #     needs a cluster-wide ClusterRole to watch Ingress/Service/Endpoints
  #     across every namespace, the same way Cilium does outside GitOps
  #     entirely. Unlike Cilium, Traefik has no bootstrap circular dependency
  #     on Argo CD (Argo CD's own pods don't need external ingress to run),
  #     so it is GitOps-managed rather than Ansible-managed.
  #   - ValidatingWebhookConfiguration, MutatingWebhookConfiguration: added
  #     2026-09-16 for cert-manager (kubernetes/infrastructure/cert-manager/).
  #     Its webhooks default and validate its own custom resources; without
  #     them an invalid Certificate or Issuer spec is accepted and fails later,
  #     opaquely, instead of being rejected at admission. Admission
  #     configuration is a cluster-scoped API by nature -- there is no
  #     namespace-scoped equivalent to grant instead.
  #
  #     This is the most powerful entry in this list and is not granted
  #     lightly: a MutatingWebhookConfiguration can in principle intercept and
  #     rewrite any object cluster-wide. cert-manager's do not. Verified
  #     against the pinned v1.21.2 manifest before granting -- the mutating
  #     webhook's rules cover only cert-manager.io/v1 certificaterequests on
  #     CREATE, and the validating webhook only the cert-manager.io and
  #     acme.cert-manager.io API groups. Neither can touch a Pod, a Secret, or
  #     anything outside cert-manager's own CRDs. Re-verify this scoping on
  #     every cert-manager version bump; a future release widening those rules
  #     would silently widen this grant.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: readonly
      description: >-
        Read-only verification identity (Gate 10 End State: bootstrap,
        verification, Argo controller and emergency identities are separate).
        Can view Applications in this project; cannot sync, delete or
        override anything. Used to produce the Gate 10 denied-action RBAC
        matrix and for any later read-only auditing.
      policies:
        - p, proj:veridex:readonly, applications, get, veridex/*, allow
        - p, proj:veridex:readonly, applications, sync, veridex/*, deny
        - p, proj:veridex:readonly, applications, delete, veridex/*, deny
        - p, proj:veridex:readonly, applications, override, veridex/*, deny
        - p, proj:veridex:readonly, applications, action/*, veridex/*, deny
      # JWT tokens are issued live (`argocd proj role create-token`) and are
      # never committed -- see docs/evidence/gates/gate-10/ for the redacted
      # evidence of a token being issued, used, and revoked.
      jwtTokens: []
