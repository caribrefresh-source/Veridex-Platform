---
# NodePort (not LoadBalancer): roles/k3s-server disables servicelb with the
# comment "no LoadBalancer implementation on netcup" -- there is no
# LoadBalancer controller on this cluster. NodePort is reachable on every
# node's public IP regardless of which node the pod is actually scheduled
# on (Cilium's kube-proxy-replacement NodePort handling).
#
# Port 32537 is one of three ports roles/firewall/defaults/main.yml already
# reserved for Traefik ("31742/32537/30051 ... when that role lands") --
# used here for websecure. The other two (31742 web/HTTP, 30051 Traefik's
# own dashboard) stay unused and unopened in the firewall, reserved for
# their original intended purposes.
#
# 32538 is a new port, not a repurposing of either reserved-but-unused one:
# neither fits Grafana (31742 was earmarked for a shared plain-HTTP
# entrypoint; 30051 for Traefik's own --api.dashboard). Grafana gets its own
# NodePort so its TLS-terminating entrypoint stays fully independent of Argo
# CD's TLS-passthrough one -- see the scope note in deployment.yaml. Named
# grafana-https, not grafana-websecure: Kubernetes port names cap at 15
# characters (IANA_SVC_NAME) and the longer form failed live validation.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      nodePort: 32537
    - name: grafana-https
      port: 8443
      targetPort: grafana-https
      nodePort: 32538
---
# Separate ClusterIP Service for metrics, deliberately NOT added as another
# port on the NodePort Service above: that would publish Traefik's metrics on
# every node's public IP. Scraping is in-cluster only, so a ClusterIP is both
# sufficient and the smaller attack surface. No firewall change is needed.
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
