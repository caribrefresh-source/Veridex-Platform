---
# Public route for the site, served by the worker-only Traefik DaemonSet
# (kubernetes/infrastructure/ingress/daemonset.yaml) on host port 443.
#
# TLS is the cert-manager-issued wildcard in certificate.yaml, referenced by
# secretName. Traefik reads the Secret from this namespace and hot-reloads it
# on renewal, so nothing here changes again at rotation time.
#
# If that Secret is absent or not yet populated, Traefik does NOT fail the
# route -- it falls back to its built-in self-signed certificate and logs the
# miss. So a 200 on 443 still does not prove TLS is trusted; check the
# issuer on the served certificate, not the status code.
#
# Hostnames are matched explicitly rather than with a catch-all: the apex
# still resolves to Squarespace, so until the Stage F cutover this route is
# exercised with an SNI override (curl --resolve), and a catch-all would also
# swallow raw-IP requests that should not be served as the website.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site
  namespace: site
spec:
  entryPoints:
    - publicsecure
  routes:
    - match: Host(`veridexeai.com`) || Host(`www.veridexeai.com`)
      kind: Rule
      services:
        - name: site
          port: 80
  tls:
    secretName: veridexeai-tls
---
# Plain HTTP exists only to send callers to HTTPS. Nothing is served over
# port 80 -- an HTTP entrypoint that served the site would be a downgrade
# path, and ACME here is DNS-01, so port 80 is never needed for issuance.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: site
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site-http-redirect
  namespace: site
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`veridexeai.com`) || Host(`www.veridexeai.com`)
      kind: Rule
      middlewares:
        - name: https-redirect
      services:
        - name: site
          port: 80
