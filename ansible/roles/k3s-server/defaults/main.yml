---
# k3s-server role default variables

k3s_install_url: "https://get.k3s.io"
k3s_install_timeout: 360
k3s_service_name: k3s

k3s_data_dir: /var/lib/rancher/k3s
k3s_config_dir: /etc/rancher/k3s
k3s_config_file: /etc/rancher/k3s/config.yaml
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

k3s_bind_address: 0.0.0.0
k3s_flannel_backend: "none"          # Cilium provides the CNI
k3s_control_plane_taint: "node-role.kubernetes.io/control-plane=true:PreferNoSchedule"

# Hourly etcd snapshots to meet the platform RPO <= 1h target for control-plane
# state. 48 retained = two days of hourly restore points.
k3s_etcd_snapshot_cron: "0 * * * *"
k3s_etcd_snapshot_retention: 48

# Off-cluster etcd snapshots via k3s's OWN native --etcd-s3 uploader.
# Deliberately unset, and NOT the mechanism Gate 9 actually uses -- kept
# blank on purpose, not merely unconfigured. Verified live 2026-09-15 against
# this exact pinned k3s binary (v1.36.4+k3s1) with a real Object-Lock-enabled
# Backblaze B2 bucket (veridex-etcd-backup, Gate 8): every upload fails with
# "Content-MD5 OR x-amz-checksum- HTTP header is required for Put Object
# requests with Object Lock parameters" -- k3s's built-in S3 client does not
# send that header, and no flag adds it (confirmed against `k3s server --help`
# and `k3s etcd-snapshot save --help`; no k3s-io/k3s GitHub issue exists for
# it as of this check). B2's own CLI uploads to this same bucket without
# issue (Gate 8's own evidence), so the incompatibility is k3s's S3 client
# specifically, not B2 or the network. Gate 9 instead uses a sidecar uploader
# (roles/etcd-s3-backup) built on the b2 CLI. If a future k3s release fixes
# this (sends Content-MD5/x-amz-checksum- on snapshot PUT), re-enabling this
# block is the smaller change -- check the upstream changelog for exactly
# that fix before assuming it still doesn't work.
etcd_s3_endpoint: ""
etcd_s3_bucket: ""
etcd_s3_folder: "etcd-snapshots"
etcd_s3_access_key: "{{ lookup('env', 'ETCD_S3_ACCESS_KEY') | default('', true) }}"
etcd_s3_secret_key: "{{ lookup('env', 'ETCD_S3_SECRET_KEY') | default('', true) }}"

k3s_kubelet_system_reserved: "cpu=500m,memory=512Mi"
k3s_kubelet_kube_reserved: "cpu=500m,memory=512Mi"
k3s_kubelet_eviction_hard: "memory.available<200Mi,nodefs.available<5%"

# API audit logging. The policy file must exist before the API server starts
# or kube-apiserver refuses to come up -- this role writes it.
k3s_audit_enabled: true
k3s_audit_log_dir: /var/log/kubernetes/audit
k3s_audit_log_maxage: 30
k3s_audit_log_maxbackup: 10
k3s_audit_log_maxsize: 100

k3s_limit_nofile: 1048576
k3s_oom_score_adjust: -999
k3s_restart_sec: 10

# Never wipe an existing cluster's state unless explicitly told to.
k3s_force_clean_bootstrap: false

k3s_api_ready_retries: 40
k3s_api_ready_delay: 5
k3s_node_register_retries: 60
k3s_node_register_delay: 10
