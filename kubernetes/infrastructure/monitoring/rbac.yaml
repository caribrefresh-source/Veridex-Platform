# Least-privilege service accounts for the observability stack. Each account
# gets only the read verbs its own component needs -- no component here ever
# writes cluster state.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
# No RBAC: node-exporter reads only the host /proc and /sys mounts on its own
# node. It never calls the Kubernetes API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Scoped to exactly the resource kinds kube-state-metrics is started with
  # (--resources= on the Deployment) -- Gate 11's node/Cilium alerts and
  # general bootstrap-service coverage, nothing wider.
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent-node-discovery
rules:
  # nodes is cluster-scoped, so this one piece of vmagent's service discovery
  # cannot be namespace-limited. Read-only, and only what the `role: node`
  # scrape config needs to resolve each node's address.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-node-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent-node-discovery
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: monitoring
---
# CoreDNS pod discovery only needs to see kube-system, so this is a
# namespace-scoped Role, not a second ClusterRole -- tighter than granting
# cluster-wide pod read for one scrape target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmagent-pod-discovery
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmagent-pod-discovery
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmagent-pod-discovery
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmsingle
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmalert
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  # Read-only pod/namespace metadata to enrich shipped log lines (pod name,
  # namespace, labels) -- fluent-bit's kubernetes filter needs this to label
  # logs by source. It never reads log content through the API (it tails
  # container log files from the host directly) and never reads secrets.
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
