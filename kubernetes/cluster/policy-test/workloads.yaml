---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-test-echo
  namespace: veridex-policy-test
  labels:
    app.kubernetes.io/name: policy-test-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-test-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-test-echo
        veridex.io/policy-role: server
    spec:
      serviceAccountName: policy-test
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: busybox:1.37.0@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          command: ["sh", "-c"]
          args:
            - mkdir -p /www; printf 'veridex-policy-test-ok\n' >/www/index.html; exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: policy-test-echo
  namespace: veridex-policy-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: policy-test-echo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-echo
  namespace: veridex-policy-test
spec:
  podSelector:
    matchLabels:
      veridex.io/policy-role: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              veridex.io/policy-role: allowed-client
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress-to-echo
  namespace: veridex-policy-test
spec:
  podSelector:
    matchLabels:
      veridex.io/policy-role: allowed-client
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              veridex.io/policy-role: server
      ports:
        - protocol: TCP
          port: 8080
