# Allow kubelet health probes to reach Argo CD's readiness/liveness ports.
#
# ROOT CAUSE (captured live, 2026-09-15, agent-1):
#
#   xx drop (Policy denied) to endpoint 1519, file bpf_lxc.c:2412,
#     identity world->17111: 10.44.4.103:60858 -> 10.44.4.188:8084 tcp SYN
#   xx drop (Policy denied) to endpoint 4088, file bpf_lxc.c:2412,
#     identity world->23186: 10.44.4.103:43062 -> 10.44.4.190:8082 tcp SYN
#
# 10.44.4.103 is veridex-agent-1's own cilium_host address -- the interface
# kubelet probes egress through. 8084 is argocd-repo-server's liveness and
# readiness port; 8082 is argocd-application-controller's readiness port.
# So these drops ARE the health probes.
#
# Argo CD's upstream install ships a NetworkPolicy per component that permits
# ingress only from sibling Argo CD pods. The kubelet is not a pod, so it
# matches no podSelector. Cilium normally covers this: allow-localhost=auto
# inserts an implicit `reserved:host` allow, and that rule exists and works --
# it has forwarded 28,188 packets. The failure is that the probe's source is
# INTERMITTENTLY resolved as `world` rather than `host`, and a world-sourced
# packet matches neither the implicit host allow nor any upstream rule, so
# default-deny drops it.
#
# The effect is cyclical and was mistaken for a transient three times: probes
# denied -> pods unready -> Service endpoints empty -> Argo CD cannot reconcile
# ("no route to host" to argocd-repo-server) -> identity resolves -> recovery.
# argocd-repo-server had accumulated 28 restarts and
# argocd-notifications-controller 40 by the time this was captured.
#
# UPDATE (captured live, 2026-09-15 23:15 UTC, agent-1, third recurrence): the
# fromCIDR clause below does NOT catch the misclassified case, contrary to the
# comment that originally justified it. Verified via the realized policy on
# the live endpoint (`cilium-dbg endpoint get 1519 -o json`): the port-8084
# rule compiles to six independent match clauses -- host/remote-node/health/
# aggregate-remote-node/a namespace-exists selector, and `cidr:10.44.0.0/16` --
# each keyed to a DIFFERENT identity. `fromCIDR` in Cilium matches only the
# CIDR-derived identity Cilium allocates for that prefix; it does not mean "any
# packet whose source IP falls in this range." `world` (reserved identity 2)
# is a distinct fallback identity. When the datapath's identity resolution
# fails, the packet carries identity 2 (world), which is in none of the six
# clauses -- not host, not the CIDR-derived identity -- so it is dropped with
# `policy-verdict:none` (no rule matched at all), live-observed repeating
# continuously against argocd-repo-server:8084 while this exact policy was
# present and `Valid`. The ipcache itself was correct at the time
# (`10.44.4.103/32 identity=1`), confirming this is a transient datapath
# resolution failure, not a stale ipcache entry.
#
# The only clause that actually admits a world-classified packet is
# `fromEntities: [world]`, added below. This is a materially wider opening
# than intended -- `world` is not scoped to this node or even this cluster's
# pod CIDR, since the whole point is it covers traffic Cilium's datapath
# could not identify. Accepted because these pod IPs are private (10.44.0.0/16)
# and never published on the host's public interface or a NodePort, so the
# realistic exposure is limited to other in-cluster pods that hit the same
# misclassification, reaching only these four health-check ports (liveness/
# readiness state, no application data). Authorized explicitly by the user,
# 2026-09-15, after this finding was reported.
#
# SCOPE: narrowly the four probe ports actually in use, verified against live
# pod specs. It grants nothing else -- every other port on these pods remains
# governed by the upstream default-deny, and no other namespace is touched.
# Health endpoints expose liveness state, not application data.
#
# HARDENING (2026-09-15, Gate 11 closure adversarial review): the three
# clauses below were originally scoped by L4 port alone. That was a real
# over-grant on 8080/8082/8084: each of those ports is not a dedicated
# health-only listener -- verified live, argocd-server's own Service maps
# BOTH its http (80) and https (443) ports to the SAME targetPort 8080 that
# serves /healthz, and the same is true of repo-server's 8084 (the
# gRPC/reflection port, per Argo CD's upstream chart) and the application-
# controller's 8082. An L4-only allow on those ports therefore admitted
# whichever full service that port carries -- the UI/API/gRPC surface, not
# only the probe -- to any source matching host/remote-node/health, the
# 10.44.0.0/16 CIDR, or (worst case) the world entity. Fixed by adding an L7
# HTTP rule restricting those three ports to the /healthz path actually
# probed (Cilium's Envoy-backed L7 proxy is confirmed active on this
# cluster: `cilium-dbg status --verbose` -> "Proxy Status: OK ... Envoy:
# external"). Port 9001 (notifications-controller) is excluded from the L7
# rule and kept as a separate plain L4 entry: its own liveness probe is a
# raw TCP socket check, not HTTP, so there is no path to restrict, and this
# was already the entire surface on that port.
#
# REMOVE THIS once the identity misclassification itself is fixed upstream or
# by configuration; it is a targeted compensating control, not a design.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-health-probes
  namespace: argocd
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-repo-server
          - argocd-application-controller
          - argocd-server
          - argocd-notifications-controller
  ingress:
    # The identities this SHOULD arrive as, kept so the policy still reads
    # correctly once the misclassification is resolved.
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "8084"   # argocd-repo-server liveness + readiness
              protocol: TCP
            - port: "8082"   # argocd-application-controller readiness
              protocol: TCP
            - port: "8080"   # argocd-server liveness + readiness
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/healthz.*"
        - ports:
            - port: "9001"   # argocd-notifications-controller liveness (TCP socket, no HTTP layer)
              protocol: TCP
    # Kept for defense-in-depth in case the datapath ever resolves the probe
    # to the CIDR-derived identity rather than host or world -- but per the
    # 2026-09-15 update above, this clause alone did NOT stop the observed
    # failure; do not rely on it as the fix.
    - fromCIDR:
        - 10.44.0.0/16
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/healthz.*"
        - ports:
            - port: "9001"
              protocol: TCP
    # The actual fix: admits the packet when the datapath's identity
    # resolution fails and falls back to `world`, which is what was observed
    # live. Scoped to only these four ports on these four pods -- see the
    # blast-radius note above -- and, as of the L7 hardening pass, further
    # scoped to the /healthz path alone on the three HTTP ports.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/healthz.*"
        - ports:
            - port: "9001"
              protocol: TCP
