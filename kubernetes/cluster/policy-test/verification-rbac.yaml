---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-verifier
  namespace: veridex-policy-test
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: policy-verifier
  namespace: veridex-policy-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-verifier
  namespace: veridex-policy-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: policy-verifier
subjects:
  - kind: ServiceAccount
    name: policy-verifier
    namespace: veridex-policy-test
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-policy-verifier-apiserver
  namespace: veridex-policy-test
spec:
  endpointSelector:
    matchLabels:
      veridex.io/policy-role: admission-verifier
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

