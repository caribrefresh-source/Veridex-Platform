---
# Gate 11 (baseline observability): VictoriaMetrics (vmsingle/vmagent/vmalert)
# + Alertmanager + node-exporter + kube-state-metrics + Loki/Fluent Bit, all
# raw pinned manifests under kubernetes/infrastructure/monitoring/ -- same
# GitOps pattern as gitops/infrastructure/traefik.yaml. Deployed into its own
# `monitoring` namespace defined by manifests/namespaces/monitoring
# namespace.yaml in the same source directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: veridex
  source:
    repoURL: https://github.com/caribrefresh-source/Veridex-Platform.git
    targetRevision: main
    path: kubernetes/infrastructure/monitoring
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
