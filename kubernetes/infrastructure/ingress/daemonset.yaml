---
# Traefik as a worker-only DaemonSet publishing host ports 80 and 443.
#
# This exists ALONGSIDE the Deployment in deployment.yaml on purpose. A
# Deployment -> DaemonSet change is not an in-place update: Argo CD prunes one
# and creates the other in an order it does not guarantee, so a straight swap
# has a window with no Traefik at all, taking Argo CD and Grafana down
# together. Stage C therefore lands this DaemonSet first, proves it serves,
# and only then removes the Deployment in a separate change.
#
# Two nodes, not five. The plan's Stage C originally said "all five node
# public IPs"; amended 2026-09-17 (see the plan's Stage C) to the two worker
# nodes only, so public TLS termination never lands on a control-plane/etcd
# node, whose blast radius is the whole cluster and whose latency matters most.
# veridex.io/role: worker is an existing node label (veridex-agent-1/2).
#
# hostPort, not NodePort: the admission policy (kubernetes/cluster/policies/
# host-exposure.yaml) denies NodePort and hostPort outside kube-system, and
# exempts kube-system precisely so the ingress controller can publish. Cilium
# reports HostPort: Enabled and a test pod bound host :80 without
# NET_BIND_SERVICE, so the container still runs with drop: [ALL] and
# readOnlyRootFilesystem -- the host port is mapped by the datapath, not bound
# inside the container.
#
# Label note: app.kubernetes.io/name: traefik is deliberate -- the existing
# NodePort Service selects it, so 32537 (Argo CD) and 32538 (Grafana) keep
# answering from these pods once the Deployment goes away. That is also why
# this DaemonSet carries the websecure and grafana-https entrypoints: the
# Service's targetPort names must resolve against whichever pod serves them.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik-ingress-ds
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: public-ingress
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: public-ingress
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # One node at a time: with only two ingress nodes, taking both out
      # together would be a full ingress outage during an image bump.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/component: public-ingress
    spec:
      serviceAccountName: traefik-ingress-controller
      nodeSelector:
        veridex.io/role: worker
      containers:
        - name: traefik
          image: "traefik:v3.7.13@sha256:96780238b1bbda5a9bb997f4307ce69e798ad1cf6eb7f2dcc0a440823467d199"
          args:
            # Public entrypoints, mapped to host 80/443 below.
            - --entrypoints.web.address=:8000
            - --entrypoints.publicsecure.address=:8445
            # Carried over from the Deployment so the NodePort Service keeps
            # working from these pods: Argo CD TLS passthrough (32537) and
            # Grafana TLS termination (32538).
            - --entrypoints.websecure.address=:8443
            - --entrypoints.grafana-https.address=:8444
            - --providers.kubernetescrd
            # site is new here: the Deployment deliberately keeps watching only
            # argocd,monitoring during the cutover, so the two do not start
            # serving the site on different ports at the same time.
            - --providers.kubernetescrd.namespaces=argocd,monitoring,site
            - --ping=true
            - --log.level=INFO
            - --api.dashboard=false
            - --api.insecure=false
            - --metrics.prometheus=true
            - --metrics.prometheus.entryPoint=metrics
            - --metrics.prometheus.addRoutersLabels=true
            - --metrics.prometheus.addServicesLabels=true
            - --entrypoints.metrics.address=:8082
          ports:
            - name: web
              containerPort: 8000
              hostPort: 80
              protocol: TCP
            - name: publicsecure
              containerPort: 8445
              hostPort: 443
              protocol: TCP
            - name: websecure
              containerPort: 8443
            - name: grafana-https
              containerPort: 8444
            - name: ping
              containerPort: 8080
            - name: metrics
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Higher than the Deployment's 50m/64Mi: these pods terminate TLS
            # for public traffic rather than proxying one internal service.
            # The workers measured 2.5% CPU and ~11% memory of 8 vCPU / 16 GiB
            # on 2026-09-17, so this is not a scheduling constraint. Revisit
            # against real traffic before the document-upload paths land.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
