# Fluent Bit v5.1.2, digest-pinned for linux/amd64 (verified against Docker
# Hub 2026-09-15). Tails container logs from every node and ships them to
# Loki, labeled by namespace/pod via the kubernetes filter.
#
# Runs as root (the image's own default, User=0) -- reading arbitrary
# container log files under /var/log/pods requires it; this is upstream's
# own documented deployment pattern, not a local choice to weaken. No other
# privilege is added: no host network/PID, no added Linux capabilities, and
# the only host paths mounted are the log directories (read-only) and a
# small per-node position-file directory.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        # Without this the /api/v1/health endpoint the probes use is not
        # registered and returns 404, so every pod sits 0/1 Ready while
        # actually tailing logs correctly.
        Health_Check  On

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*fluent-bit*
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     20MB
        DB                /var/lib/fluent-bit/positions/tail.db

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name    loki
        Match   kube.*
        Host    loki.monitoring.svc
        Port    3100
        Labels  job=fluentbit
        Label_keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']
        Line_Format json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: "fluent/fluent-bit:5.1.2@sha256:71cda445290efc2d45d565c12e0de4b15aa0182510276ad50c317aae1423d7ee"
          ports:
            - name: http
              containerPort: 2020
          # Liveness and readiness deliberately test different things.
          # /api/v1/health reflects OUTPUT DELIVERY health -- it turns
          # unhealthy when retries to Loki accumulate. Using it for liveness
          # means a temporarily unreachable Loki kills every log shipper in
          # the cluster, which is what happened here: Loki was restarting,
          # fluent-bit's health check went unhealthy, and all five pods went
          # into CrashLoopBackOff while tailing logs perfectly well.
          # Liveness therefore tests only that the process answers at all;
          # delivery health is a readiness concern.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /var/lib/fluent-bit/positions
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: positions
          hostPath:
            path: /var/lib/monitoring/fluent-bit-positions
            type: DirectoryOrCreate
