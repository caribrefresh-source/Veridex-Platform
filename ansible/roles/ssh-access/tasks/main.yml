---
# ssh-access role tasks
#
# Gate 1 G01-C5: administrative access must be recoverable. Verified live
# 2026-09-13: /root/.ssh/authorized_keys on every node held exactly one key
# -- the one netcup's provisioning API installed at image time -- with no
# fallback if it were lost. This role makes admin_ssh_public_keys in the
# inventory (ansible/inventory/production/group_vars/all.yml) the sole,
# version-controlled source of truth for root's authorized_keys, and refuses
# to run unless a break-glass key is present alongside the primary one.

- name: Assert the declared admin key roles and formats are valid
  ansible.builtin.assert:
    that:
      - admin_ssh_public_keys is defined
      - admin_ssh_public_keys | length >= 2
      - >-
        admin_ssh_public_keys
        | select('match', '^ssh-ed25519 [A-Za-z0-9+/]+={0,2} .+$')
        | list | length == admin_ssh_public_keys | length
      - >-
        admin_ssh_public_keys
        | select('search', ' veridex-netcup-prod(?: |$)')
        | list | length == 1
      - >-
        admin_ssh_public_keys
        | select('search', ' veridex-breakglass-[0-9]{8}(?: |$)')
        | list | length >= 1
    fail_msg: >-
      admin_ssh_public_keys must contain exactly one Ed25519 primary key named
      veridex-netcup-prod and at least one Ed25519 emergency key named
      veridex-breakglass-YYYYMMDD. A single, malformed, or undesignated key is
      the unrecoverable state this role exists to prevent (Gate 1 G01-C5).
    quiet: true

- name: Extract managed SSH key material for uniqueness validation
  ansible.builtin.set_fact:
    _admin_ssh_key_material: >-
      {{ (_admin_ssh_key_material | default([])) + [item.split()[1]] }}
  loop: "{{ admin_ssh_public_keys }}"
  loop_control:
    label: "{{ item.split()[2] | default('(unnamed key)') }}"

- name: Reject duplicate admin keys even when their comments differ
  ansible.builtin.assert:
    that:
      - >-
        _admin_ssh_key_material | unique | length
        == _admin_ssh_key_material | length
    fail_msg: >-
      admin_ssh_public_keys contains duplicate public-key material. Primary
      and emergency access must be backed by cryptographically distinct keys;
      changing a duplicate key's comment does not create a recovery path.
    quiet: true

- name: Validate each managed key is a well-formed public key
  # The write-then-read-back check below only proves the file contains
  # whatever string admin_ssh_public_keys holds -- it can't catch a typo'd or
  # truncated key, which would look "present verbatim" right up until the day
  # it's actually needed. ssh-keygen -lf refuses anything that doesn't parse
  # as a real public key.
  ansible.builtin.command:
    cmd: ssh-keygen -lf /dev/stdin
    stdin: "{{ item }}"
  loop: "{{ admin_ssh_public_keys }}"
  loop_control:
    label: "{{ item.split()[2] | default('(unnamed key)') }}"
  changed_when: false

- name: Ensure /root/.ssh exists with correct permissions
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render authorized_keys as the exact, version-controlled key list
  ansible.builtin.copy:
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
    content: "{{ admin_ssh_public_keys | map('trim') | join('\n') }}\n"

- name: Read back authorized_keys
  ansible.builtin.command:
    cmd: cat /root/.ssh/authorized_keys
  register: _authorized_keys
  changed_when: false

- name: Assert every managed key is present verbatim after write
  ansible.builtin.assert:
    that:
      - item in _authorized_keys.stdout
    fail_msg: "Key not found in authorized_keys after write: {{ item }}"
    quiet: true
  loop: "{{ admin_ssh_public_keys }}"
