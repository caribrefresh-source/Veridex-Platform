# Loki 3.7.7 single-binary, digest-pinned for linux/amd64 (verified against
# Docker Hub 2026-09-15). Filesystem storage, no object store -- MinIO
# (Gate 13) doesn't exist yet and Gate 11 must not depend on it.
#
# hostPath on veridex-agent-2 (vmsingle already uses agent-1's disk for
# metrics; splitting the two stateful components across the two big-disk
# agent nodes spreads load rather than concentrating both on one node).
# Same known limitation as vmsingle: no replication, node-local, tracked for
# migration once Gate 12 (Longhorn) exists.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 336h
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      # Required whenever retention_enabled is true -- Loki refuses to start
      # with "compactor.delete-request-store should be configured when
      # retention is enabled" otherwise. filesystem matches the object store
      # above; there is no MinIO to point at until Gate 13.
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      serviceAccountName: loki
      nodeSelector:
        kubernetes.io/hostname: veridex-agent-2
      initContainers:
        - name: fix-data-dir-ownership
          image: "busybox:1.37.0@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0"
          command: ["/bin/sh", "-c", "chown -R 10001:10001 /loki"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Same as vmsingle: CHOWN alone only suffices on a first run
                # against an empty root-owned directory. After Loki has
                # written, /loki/wal and friends are 0700 owned by 10001, and
                # root needs DAC_OVERRIDE and FOWNER to traverse and re-own
                # them -- otherwise every restart fails with
                # "chown: /loki/wal: Permission denied".
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: data
              mountPath: /loki
      containers:
        - name: loki
          image: "grafana/loki:3.7.7@sha256:550d599ec4efacd8ebc0a5871766855057cba2bd0c669c0711d898c00d6d901f"
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          hostPath:
            path: /var/lib/monitoring/loki-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
