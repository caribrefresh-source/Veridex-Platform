# kube-state-metrics v2.20.0, digest-pinned for linux/amd64 (verified against
# registry.k8s.io 2026-09-15). --resources restricts it to exactly what
# rbac.yaml's ClusterRole grants and what Gate 11's alerts need (node
# readiness, Cilium/CoreDNS/Argo CD pod health, DaemonSet/Deployment
# coverage) -- not the full default resource set.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:01171220c7c059afc85034ffe687bfe7249e41c0cc46fbe9a5128503ceee3016"
          args:
            - --resources=nodes,pods,namespaces,daemonsets,deployments,statefulsets,persistentvolumeclaims
            - --port=8080
            - --telemetry-port=8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          # The two probes go to DIFFERENT ports. Measured live against
          # v2.20.0 (curl against the pod IP, both ports, every path):
          #   :8080  /healthz 200  /livez 200  /readyz 404
          #   :8081  /healthz 404  /livez 404  /readyz 200
          # So liveness belongs on the metrics port and readiness on the
          # telemetry port. Putting both on either one leaves a 404 that
          # either kills the container or holds it permanently unready.
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
