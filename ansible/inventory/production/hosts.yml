---
# Production inventory — netcup, Nuremberg (SCP site id=1).
#
# Generated from live SCP API state 2026-09-12 by scripts/netcup-discover.py.
# Re-run that script to verify this file still matches reality before a build.
#
# ansible_host is the PUBLIC IP: it is how Ansible reaches the node. All
# cluster traffic (k3s node-ip, advertise-address, the VXLAN underlay, the
# kube-vip API VIP) binds to private_ip on the Cloud vLAN instead.
#
# vlan_mac is the vNIC's MAC on vLAN 1006740. netplan should match on the MAC
# rather than an interface name -- names are not guaranteed stable across
# reinstalls, the MAC is (it is the public NIC's MAC + 1 in the last octet).
#
# Role assignment rationale: the 3x RS 1000 G12 (4 vCPU / 8 GiB) are the
# control plane -- homogeneous, symmetric etcd quorum, and identical to the
# Hetzner control-plane nodes which run this workload at 63-68% RAM. The
# 2x RS 2000 G12 (8 vCPU / 16 GiB / 512 GiB) are agents: the 512 GiB disks
# belong where Longhorn replicas, CNPG primaries and MinIO shards live.

