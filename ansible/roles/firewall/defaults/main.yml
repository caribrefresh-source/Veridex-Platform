---
# firewall role default variables
#
# Model: the private vLAN is trusted in full; the public interface allows only
# SSH plus whatever is explicitly published. k3s binds its API to 0.0.0.0:6443
# and kubelet to 10250, so without this they are reachable from the internet.

firewall_ssh_port: 22

# Trusted source networks -- the Cloud vLAN. Everything from here is
# accepted, which covers the whole k3s + Cilium NODE-to-node port surface
# without enumerating it: 6443 API, 2379-2380 etcd, 10250 kubelet, 8472/udp
# VXLAN, 51871/udp Cilium WireGuard, 4240 Cilium health -- because that
# traffic's source is always a real node vLAN address.
firewall_trusted_networks:
  - "10.2.0.0/16"

# The pod CIDR, trusted for the API port ONLY -- not a blanket accept like
# the vLAN above. Found live at Gate 6: a pod's own traffic to a
# host-network service on a DIFFERENT node (the k3s API server via the
# `kubernetes` ClusterIP, which Cilium DNATs to a real node:6443) arrives
# with the POD's real address as source, not the node's -- outside
# 10.2.0.0/16, so the default-drop INPUT policy silently ate it. Node-to-node
# and pod-to-pod traffic were never affected (neither ever presents a
# pod-CIDR source to a HOST's own INPUT chain -- decapsulated pod-to-pod
# traffic is delivered to the destination pod's veth, not a host-local
# socket), which is why this went unnoticed through Gates 0-5: nothing
# before Gate 6 made a pod call a host-network service on another node.
#
# Scoped to the API port (api_port, below) deliberately: an independent
# review correctly flagged that a blanket accept here -- with no
# NetworkPolicy enforcement existing yet (k3s's disable-network-policy) --
# would let any pod reach every host-bound port on every node, including
# SSH ahead of its rate limiter. Widen only with the same justification this
# entry required.
firewall_trusted_pod_networks:
  - "{{ k3s_cluster_cidr }}"

# The exact host ports pods may reach, and nothing else. Each entry carries
# its own justification, per the rule stated above.
#
#   api_port (6443) -- the original Gate 6 entry, reasoning above.
#
#   9100 node-exporter -- added at Gate 11. node-exporter runs hostNetwork so
#     that node metrics survive a Cilium failure (if the CNI is the thing
#     that is broken, the metrics that would diagnose it must not depend on
#     it). That puts its listener on the host, so vmagent -- an ordinary pod
#     -- reaches it with a pod-CIDR source address and the default-drop INPUT
#     policy ate it: all five node-exporter targets timed out while the
#     exporter itself answered 200 on the node's own loopback. Read-only
#     metrics endpoint, no authentication surface, and scoped to this one
#     port rather than widening the pod CIDR to a blanket accept.
#
#   2381 etcd metrics -- added at Gate 11 alongside k3s_etcd_expose_metrics.
#     Same shape as 9100: the listener is on the host, vmagent is an ordinary
#     pod, so without this the default-drop INPUT policy eats the scrape. The
#     endpoint is unauthenticated by design in k3s, which is exactly why it is
#     reachable only from the vLAN (already trusted) and this one pod CIDR on
#     this one port -- not published to any node's public interface. It serves
#     operational telemetry only: quorum, leader, WAL latency, database size.
#     Never key or value data.
firewall_trusted_pod_ports:
  - "{{ api_port }}"
  - 9100
  - 2381

# Published on the PUBLIC interface. Only 32537 (Traefik's websecure
# NodePort, kubernetes/infrastructure/ingress/service.yaml) is open so far --
# the minimum needed to reach Argo CD over HTTPS. 31742 (web/HTTP) and 30051
# (dashboard) stay closed until something actually needs them; opening a
# port nothing listens on yet is needless attack surface.
firewall_public_tcp_ports:
  - 32537
firewall_public_udp_ports: []

# Rate-limit NEW SSH connections. Not a substitute for key-only auth (already
# enforced: PasswordAuthentication no), but it blunts scanning noise.
#
# 30/minute, not the tighter 10 that reads as more secure. Password auth is
# already off so this cannot stop credential stuffing -- it only caps
# connection floods. Set too low it locks out legitimate automation instead:
# Ansible with forks=20, plus verification loops, opens new connections in
# bursts, and beyond the limit they are DROPPED, which is indistinguishable
# from a lockout while you are debugging one.
firewall_ssh_ratelimit: true
firewall_ssh_rate: "30/minute"

firewall_nft_conf: /etc/nftables.conf
