---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: policy-test
  namespace: veridex-policy-test
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    count/pods: "20"
    count/jobs.batch: "20"
    count/secrets: "20"
    count/configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: policy-test
  namespace: veridex-policy-test
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-test
  namespace: veridex-policy-test
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-egress
  namespace: veridex-policy-test
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns
  namespace: veridex-policy-test
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
