---
# k3s-agent role handlers

# Restarted, not reloaded: k3s reads config.yaml only at start, exactly as on
# the servers. A config change that is not restarted has not taken effect.
- name: restart k3s-agent
  ansible.builtin.systemd:
    name: "{{ k3s_agent_service_name }}"
    state: restarted
    enabled: true
