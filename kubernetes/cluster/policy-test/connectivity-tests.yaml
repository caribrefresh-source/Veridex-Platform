---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: policy-test-allowed
  namespace: veridex-policy-test
spec:
  schedule: "1-59/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 0
  jobTemplate:
    metadata:
      labels:
        veridex.io/policy-test-suite: connectivity
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            veridex.io/policy-role: allowed-client
            veridex.io/policy-test-suite: connectivity
        spec:
          serviceAccountName: policy-test
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: test
              image: busybox:1.37.0@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
              command: ["sh", "-ec"]
              args:
                - |
                  nslookup kubernetes.default.svc.cluster.local
                  test "$(wget -qO- -T 5 http://policy-test-echo:8080)" = "veridex-policy-test-ok"
                  echo POLICY_TEST_ALLOWED_PASS
              resources:
                requests: {cpu: 10m, memory: 8Mi}
                limits: {cpu: 50m, memory: 32Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: policy-test-denied
  namespace: veridex-policy-test
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 0
  jobTemplate:
    metadata:
      labels:
        veridex.io/policy-test-suite: connectivity
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            veridex.io/policy-role: denied-client
            veridex.io/policy-test-suite: connectivity
        spec:
          serviceAccountName: policy-test
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: test
              image: busybox:1.37.0@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
              command: ["sh", "-ec"]
              args:
                - |
                  if wget -qO- -T 3 http://policy-test-echo:8080; then exit 41; fi
                  if nslookup example.org 1.1.1.1; then exit 42; fi
                  if wget -qO- -T 3 http://1.1.1.1; then exit 43; fi
                  echo POLICY_TEST_DENIED_PASS
              resources:
                requests: {cpu: 10m, memory: 8Mi}
                limits: {cpu: 50m, memory: 32Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
