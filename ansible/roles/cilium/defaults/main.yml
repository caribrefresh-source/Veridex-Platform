---
# cilium role default variables
#
# Versions, CLI checksums and the k8sServiceHost/Port are set in
# inventory group_vars; these are the install-mechanics defaults.

cilium_namespace: kube-system
cilium_cli_url_base: "https://github.com/cilium/cilium-cli/releases/download"
cilium_cli_bin: /usr/local/bin/cilium
cilium_install_timeout: 900

# KUBECONFIG for the CLI. k3s writes here; this is NOT the kubeadm path.
cilium_kubeconfig: /etc/rancher/k3s/k3s.yaml

cilium_ready_retries: 60
cilium_ready_delay: 10

# Gate 11 (baseline observability): cluster-wide Hubble flow visibility.
# enable-hubble is already true at the agent level (set by `cilium install`'s
# own default) -- this adds hubble-relay, the component that aggregates flows
# across nodes. See tasks/main.yml for the pod-template-hash safety check
# that guards against this silently restarting the agent DaemonSet.
cilium_hubble_relay_enabled: true

# Gate 11 (baseline observability): Cilium's own agent and operator metrics.
#
# Without this there are no cilium_* series at all, so Cilium alerting has to
# infer agent health from kube-state-metrics pod readiness -- which says a pod
# is Running, not that the datapath is healthy. Absent: endpoint regeneration
# failures, policy revision state, BPF map pressure, IP allocation exhaustion,
# drop counts by reason, and the conntrack pressure that already differs 4x
# between this cluster's two agent nodes.
#
# Applied automatically on a FRESH install (the flags below are part of the
# install command, so a clean rebuild gets it with no extra step).
#
# On an EXISTING cluster it is different: enabling it changes the agent
# DaemonSet's pod template, which rolls every Cilium pod. CLAUDE.md Sections 9
# and 15 prohibit that without root-cause analysis and explicit authorisation,
# and this session has already seen what an unplanned Cilium roll costs. So the
# converge path is gated behind the flag below, which is deliberately false:
# a routine `ansible-playbook` run will NOT restart Cilium to pick this up.
# Set it to true for one authorised run when the restart is actually intended.
cilium_prometheus_enabled: true
cilium_allow_disruptive_upgrade: false

# Cilium's host firewall -- the only thing that can actually filter NodePort
# and hostPort traffic on this cluster.
#
# Why: proven live 2026-09-17 that with kubeProxyReplacement=true, NodePort and
# hostPort are served in eBPF at tc ingress, BEFORE netfilter's INPUT chain
# sees the packet. roles/firewall's allowlist therefore does not gate them at
# all, and a NodePort on a port that allowlist has never contained answered 200
# from the public internet on every node tested. Full finding:
# docs/security/nodeport-bypasses-host-firewall.md.
#
# Enforcement has to happen in the same datapath that is bypassing nftables,
# and this flag is what makes the host endpoint policy-enforceable at all.
#
# SETTING THIS TRUE IS, BY ITSELF, BEHAVIOURALLY INERT. Cilium's host endpoint
# stays default-allow until a CiliumClusterwideNetworkPolicy with a
# nodeSelector actually selects it. Nothing is filtered by this flag alone.
# That is deliberate, and it is why the restart is taken now rather than later:
# the flag needs an agent roll, the policy does not (policies are dynamic), so
# the disruptive half happens while it cannot break anything, and the dangerous
# half happens later with no restart and in policy audit mode.
#
# DO NOT add a host CiliumClusterwideNetworkPolicy casually. Both the
# operational and the break-glass credential are SSH keys
# (docs/security/emergency-access.md), so a host policy that drops tcp/22
# locks every node out simultaneously with no documented way back short of
# reinstalling. Build any host policy in audit mode
# (`cilium endpoint config <host-id> PolicyAuditMode=Enabled`), observe real
# traffic, and only then enforce.
#
# Like the metrics flag above: applied automatically on a FRESH install, and
# gated behind cilium_allow_disruptive_upgrade on an existing cluster.
cilium_host_firewall_enabled: true

# Cilium's chart ships maxUnavailable: 2, which on this five-node cluster
# takes 40% of the CNI down at once during any roll. Existing pods keep
# working (the eBPF datapath survives without the agent) but policy updates
# and new pod networking pause on every node whose agent is gone. During the
# 2026-09-15 incident, having several agents down simultaneously is part of
# what turned a bad config into a visible outage. One at a time is slower and
# markedly less alarming.
cilium_max_unavailable: 1
