worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /plans { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /404 { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri =404; }

    error_page 404 /errors/404.html;
    location = /errors/404.html { internal; }
  }
}
