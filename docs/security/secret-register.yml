# Secret register — where every secret this repository consumes is held.
#
# NAMES ONLY. No value, fragment or hash of a secret ever goes in this file or
# anywhere else in Git. scripts/lint-secret-register.py checks this file
# against what the code actually consumes, in both directions, on every commit.
#
# Fields
#   name                 env var name, Actions secret name, file path, or the
#                        path of a manifest/template containing `kind: Secret`
#   kind                 env | github-actions | kubernetes-secret | file
#   sensitive            false only for identifiers that grant nothing alone
#   purpose              what the value is used for
#   held_in              where the value lives -- the destination Gate 0 requires
#   provider             who issues or hosts it; never Hetzner
#   status               active | deferred
#   deferred_until_gate  required when deferred: the plan gate that creates it
#
# A deferred entry is not an unresolved destination: its consumer is disabled or
# not yet run, and the gate that creates it is named. When that gate closes, set
# status: active and a concrete held_in.

version: 1
secrets:
  - name: K3S_TOKEN
    kind: env
    sensitive: true
    purpose: k3s cluster join token for servers and agents (ansible k3s-server / k3s-agent roles; they do not yet refuse an empty token -- tracked for Gate 4)
    held_in: operator workstation file ~/.config/veridex/k3s-token, exported as K3S_TOKEN when running the k3s playbooks
    provider: operator-workstation
    status: active

  - name: ARGOCD_REPO_USERNAME
    kind: env
    sensitive: false
    purpose: GitHub account name paired with the Argo CD repository token
    held_in: >-
      operator workstation file ~/.config/veridex/argocd-repo-pat (line 1),
      exported as ARGOCD_REPO_USERNAME when running bootstrap-argocd.yml --
      set to the literal x-access-token convention (authenticates purely on
      the paired token, so the actual GitHub account name never needs to be
      known or stored); created at Gate 10 (docs/evidence/gates/gate-10/)
    provider: github
    status: active

  - name: ARGOCD_REPO_PAT
    kind: env
    sensitive: true
    purpose: read-only GitHub token Argo CD uses to clone caribrefresh-source/Veridex-Platform
    held_in: >-
      operator workstation file ~/.config/veridex/argocd-repo-pat (line 2),
      exported as ARGOCD_REPO_PAT when running bootstrap-argocd.yml; a
      classic GitHub PAT the operator supplied from an existing personal
      credentials file rather than one freshly minted for this gate -- its
      exact GitHub-configured scope was not independently confirmed via the
      GitHub API (see docs/evidence/gates/gate-10/, Known Limitations: a
      REST API probe returned 401 for reasons traced to the probe's own
      script bugs, not the token; git-level access was confirmed working via
      curl -u and Argo CD's own live sync, but scope -- read-only vs broader
      -- was not separately enumerated). Created at Gate 10
      (docs/evidence/gates/gate-10/); rotating to a token minted fresh and
      scoped read-only-on-this-repo-only is a recommended follow-up, not
      required for this gate's PASS.
    provider: github
    status: active

  - name: ansible/roles/argocd-bootstrap/templates/repo-credential.yaml.j2
    kind: kubernetes-secret
    sensitive: true
    purpose: Argo CD repository credential Secret, rendered from ARGOCD_REPO_USERNAME and ARGOCD_REPO_PAT
    held_in: >-
      Secret argocd-repo-veridex-platform in namespace argocd on the netcup
      cluster; rendered to a root-only 0600 temp file on the bootstrap
      server (/root/.argocd-repo-credential.yaml) that is removed in an
      always: block after apply. Created at Gate 10
      (docs/evidence/gates/gate-10/).
    provider: netcup-cluster
    status: active

  - name: ETCD_S3_ACCESS_KEY
    kind: env
    sensitive: true
    purpose: access key for off-cluster k3s etcd snapshots
    held_in: operator workstation file ~/.config/veridex/b2-etcd-backup-writer-key, exported as ETCD_S3_ACCESS_KEY when running playbooks/etcd-s3-backup.yml -- a Backblaze B2 application key id restricted to the veridex-etcd-backup bucket, capabilities listBuckets/listFiles/writeFiles (no deleteFiles, no writeFileRetentions), created 2026-09-15, expires 2026-12-14 (90 days; no rotation alerting exists yet -- tracked under Gate 20), created at Gate 8 (docs/evidence/gates/gate-08/); consumed by roles/etcd-s3-backup, NOT by k3s's own native --etcd-s3 uploader, which is proven incompatible with this bucket's Object Lock and deliberately left disabled (roles/k3s-server/defaults/main.yml, Gate 9)
    provider: backblaze-b2
    status: active

  - name: ETCD_S3_SECRET_KEY
    kind: env
    sensitive: true
    purpose: secret key paired with ETCD_S3_ACCESS_KEY for off-cluster etcd snapshots
    held_in: operator workstation file ~/.config/veridex/b2-etcd-backup-writer-key, exported as ETCD_S3_SECRET_KEY when running playbooks/etcd-s3-backup.yml -- the same application key's secret, paired with ETCD_S3_ACCESS_KEY; created 2026-09-15, expires 2026-12-14 (90 days; no rotation alerting exists yet -- tracked under Gate 20); created at Gate 8 (docs/evidence/gates/gate-08/); consumed by roles/etcd-s3-backup, NOT by k3s's own native --etcd-s3 uploader, which is proven incompatible with this bucket's Object Lock and deliberately left disabled (roles/k3s-server/defaults/main.yml, Gate 9)
    provider: backblaze-b2
    status: active

  - name: ~/.config/veridex/b2-etcd-backup-restore-key
    kind: file
    sensitive: true
    purpose: >-
      B2 restore-operator identity for veridex-etcd-backup (Identity table's
      "Wasabi/B2 restore operator" row) -- read-only recovery access, held for
      approved drills, not consumed by any automation or code path today.
    held_in: operator workstation file ~/.config/veridex/b2-etcd-backup-restore-key -- a Backblaze B2 application key id + secret restricted to the veridex-etcd-backup bucket, capabilities listBuckets/listFiles/readFiles only, created 2026-09-15, expires 2026-12-14 (90 days; no rotation alerting exists yet -- tracked under Gate 20), created and proven at Gate 8 (docs/evidence/gates/gate-08/); docs/security/b2-restore-access.md records when it should be used
    provider: backblaze-b2
    status: active
    manual_only: true
    manual_only_reviewed: "2026-09-14"

  - name: SCP_REFRESH_TOKEN
    kind: env
    sensitive: true
    purpose: optional override for the netcup SCP API offline refresh token used by scripts/netcup-*.py
    held_in: operator workstation file ~/.config/veridex/netcup-refresh-token (the scripts' default); the environment variable only overrides it
    provider: netcup
    status: active

  - name: NETCUP_USER_ID
    kind: env
    sensitive: false
    purpose: optional override for the netcup SCP internal user id
    held_in: not stored -- derived from the SCP access token claims when unset (scripts/netcup-discover.py resolve_user_id)
    provider: netcup
    status: active

  - name: ~/.config/veridex/netcup-refresh-token
    kind: file
    sensitive: true
    purpose: cached netcup SCP API offline refresh token (device-login result)
    held_in: operator workstation, created by scripts/netcup-discover.py device login
    provider: netcup
    status: active

  - name: ~/.ssh/veridex_netcup_ed25519
    kind: file
    sensitive: true
    purpose: SSH private key Ansible uses to reach the five netcup nodes as root
    held_in: operator workstation ~/.ssh/veridex_netcup_ed25519; only the public half is registered with netcup and installed on the nodes
    provider: operator-workstation
    status: active

  - name: ~/.ssh/veridex_breakglass_ed25519
    kind: file
    sensitive: true
    purpose: >-
      Emergency-only SSH private key (Gate 1 G01-C5, recoverable admin
      access). Not used for routine Ansible runs -- only the operational key
      above is. Generated 2026-09-13; docs/security/emergency-access.md
      records when it should be used and what to do after using it.
    held_in: operator workstation ~/.ssh/veridex_breakglass_ed25519; only the public half is committed, in ansible/inventory/production/group_vars/all.yml (admin_ssh_public_keys)
    provider: operator-workstation
    status: active
    manual_only: true
    manual_only_reviewed: "2026-09-13"
