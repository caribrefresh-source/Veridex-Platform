# Gate 11 acceptance evidence: a deliberately unhealthy workload used to
# TRIGGER the Argo reconciliation alert class, so that "trigger and receive"
# is proven rather than assumed.
#
# Nothing references this path from gitops/, so it deploys ONLY when an
# ephemeral Application is pointed at it by hand during a gate run, and stops
# existing the moment that Application is deleted. It is not part of any
# reconciled app-of-apps.
#
# The image is intentionally unresolvable and the progress deadline is short
# (30s instead of the 600s default) so Argo CD reports Degraded in well under
# a minute rather than ten -- the alert needs the app Degraded for 5m, and
# waiting 10m for the rollout to give up first would make the test needlessly
# slow without proving anything extra.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate11-alert-trigger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gate11-alert-trigger
    veridex.io/purpose: gate-11-acceptance-evidence
spec:
  replicas: 1
  progressDeadlineSeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: gate11-alert-trigger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate11-alert-trigger
    spec:
      containers:
        - name: never-starts
          image: "veridex.invalid/deliberately-nonexistent:gate11-alert-test"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
