---
# App-of-apps root. Everything else in gitops/ is reconciled from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: veridex
  source:
    repoURL: https://github.com/caribrefresh-source/Veridex-Platform.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      # bootstrap/ holds this Application's own manifest plus the argocd
      # Namespace, which is Ansible's sole bootstrap exception (see
      # gitops/bootstrap/namespace.yaml) -- excluded so the root app never
      # tries to reconcile the object that creates it, or take ownership of
      # a namespace Ansible deliberately owns instead.
      #
      # policies/ holds CI-time contracts, NOT Kubernetes manifests --
      # consumer-capability-gates.yaml is a `gates: []` document with no
      # apiVersion or kind. Argo CD's directory source parses every .yaml
      # under its path as a manifest, so leaving it in scope would fail
      # manifest generation for the whole root app and stall every child
      # Application behind a ComparisonError. Excluded deliberately.
      exclude: "{bootstrap/**,policies/**,templates/**,vendor/**,secrets/**}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
