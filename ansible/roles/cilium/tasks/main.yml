---
# cilium role tasks
#
# Runs on the bootstrap server only: this is a cluster-wide install, not a
# per-node one. The DaemonSet reaches every node by itself.

- name: Identify the bootstrap server
  ansible.builtin.set_fact:
    is_first_server: "{{ inventory_hostname == (groups['k3s_servers'] | sort | first) }}"

- name: Confirm the API is reachable through the VIP before installing
  ansible.builtin.command:
    cmd: >-
      k3s kubectl --server=https://{{ cilium_k8s_service_host }}:{{ cilium_k8s_service_port }}
      get --raw /healthz
  register: _vip_ok
  changed_when: false
  failed_when: _vip_ok.stdout != 'ok'
  when: is_first_server | bool

- name: Check for an existing Cilium install
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} get daemonset cilium -o jsonpath={.metadata.name}
  register: _cilium_ds
  changed_when: false
  failed_when: false
  when: is_first_server | bool

- name: Download the pinned Cilium CLI
  ansible.builtin.get_url:
    url: "{{ cilium_cli_url_base }}/v{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz"
    dest: /tmp/cilium-cli.tar.gz
    checksum: "sha256:{{ cilium_cli_sha256_amd64 }}"
    mode: "0600"
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') == ''

- name: Unpack the Cilium CLI
  ansible.builtin.unarchive:
    src: /tmp/cilium-cli.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: "{{ cilium_cli_bin }}"
    mode: "0755"
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') == ''

# Flags, and why each is here:
#   routingMode/tunnelProtocol  VXLAN over the vLAN. Native routing would need
#                               route injection a layer-2 vLAN cannot provide.
#   encryption + nodeEncryption WireGuard encrypts; it does NOT tunnel. VXLAN
#                               remains the transport.
#   k8sServiceHost/Port         the kube-vip VIP. kube-proxy is disabled, so
#                               Cilium cannot discover the API via ClusterIP.
#   ipam.mode=kubernetes        pod CIDRs come from the node spec k3s assigns.
#   MTU=  (UPPERCASE)           the Helm key is MTU, not mtu. Helm accepts an
#                               unknown --set key without complaint, so
#                               `--set mtu=` is silently discarded -- which is
#                               why the Hetzner role's cilium_mtu: 1360 has
#                               never applied. Default here is 0 (auto); see
#                               group_vars for the measurements behind that.
#   NO socketLB.enabled=false   not ported. The Hetzner stack needs three
#                               mechanisms to force it and records no reason,
#                               and v1.20 changed behaviour in that area.
- name: Install Cilium
  ansible.builtin.command:
    cmd: >-
      {{ cilium_cli_bin }} install
      --version {{ cilium_version }}
      --namespace {{ cilium_namespace }}
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
      --set kubeProxyReplacement={{ cilium_kube_proxy_replacement | string | lower }}
      --set routingMode=tunnel
      --set tunnelProtocol=vxlan
      --set encryption.enabled=true
      --set encryption.type=wireguard
      --set encryption.nodeEncryption=true
      --set ipam.mode=kubernetes
      --set bpf.masquerade=true
      --set MTU={{ cilium_mtu }}
      --set operator.replicas=2
      --set prometheus.enabled={{ cilium_prometheus_enabled | string | lower }}
      --set operator.prometheus.enabled={{ cilium_prometheus_enabled | string | lower }}
      --set hostFirewall.enabled={{ cilium_host_firewall_enabled | string | lower }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: _cilium_install
  changed_when: _cilium_install.rc == 0
  timeout: "{{ cilium_install_timeout }}"
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') == ''

# Converge an existing install. Cilium is already running in most re-runs, so
# `cilium install` is skipped -- but a changed MTU still has to reach the
# cluster, and that requires an upgrade plus a DaemonSet restart.
#
# The repository contract prohibits restarting the Cilium DaemonSet without
# root-cause analysis and explicit authorisation. That bar is met here and the
# reasoning is recorded in group_vars: pods were configured at MTU 1500 while
# only ~1354 bytes survived the VXLAN + WireGuard path, silently dropping
# large packets. This task only fires when the running MTU actually differs
# from the intended one, so a steady-state run never restarts anything.
- name: Read the MTU currently in effect
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ cilium_namespace }} get configmap cilium-config -o yaml
      | awk '/^  mtu:/ {print $2}'
    executable: /bin/bash
  register: _live_mtu
  changed_when: false
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') != ''

# The API endpoint drifts the same way the MTU does, and fails far more
# quietly. k8sServiceHost lands in the DaemonSet as KUBERNETES_SERVICE_HOST,
# not in cilium-config, so reading the ConfigMap says nothing about it.
#
# Set to 127.0.0.1 this works on every server -- the API server is local --
# and cannot work on any agent, where nothing listens there. The install is
# therefore healthy on a control-plane-only cluster and breaks the moment a
# worker joins, which is exactly when nobody is looking at Cilium.
#
# shell, not command: the jsonpath filter needs nested double quotes, and the
# command module's shlex split strips them.
- name: Read the API endpoint currently in effect
  ansible.builtin.shell:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} get daemonset cilium
      -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KUBERNETES_SERVICE_HOST")].value}'
    executable: /bin/bash
  register: _live_api_host
  changed_when: false
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') != ''

- name: Upgrade Cilium when the MTU or API endpoint has drifted
  ansible.builtin.command:
    cmd: >-
      {{ cilium_cli_bin }} upgrade
      --namespace {{ cilium_namespace }}
      --reuse-values
      --set MTU={{ cilium_mtu }}
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: _cilium_upgrade
  changed_when: _cilium_upgrade.rc == 0
  timeout: "{{ cilium_install_timeout }}"
  when:
    - is_first_server | bool
    - _cilium_ds.stdout | default('') != ''
    # An absent mtu key and an explicit 0 both mean "auto-detect", so they
    # must compare equal. Treating them as different made this task fire on
    # every run and restart the Cilium DaemonSet each time -- precisely the
    # routine restart the repository contract prohibits.
    - >-
      (_live_mtu.stdout | default('') | trim | replace('"', '') | default('0', true))
      != (cilium_mtu | string)
      or (_live_api_host.stdout | default('') | trim)
      != (cilium_k8s_service_host | string)

- name: Restart the Cilium DaemonSet to apply the converged values
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} rollout restart daemonset/cilium
  when: _cilium_upgrade is defined and _cilium_upgrade is changed

- name: Wait for the Cilium rollout to finish
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} rollout status daemonset/cilium
      --timeout=600s
  changed_when: false
  when: _cilium_upgrade is defined and _cilium_upgrade is changed

- name: Wait for the Cilium DaemonSet to be ready on every node
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} get daemonset cilium
      -o jsonpath={.status.numberReady}
  register: _cilium_ready
  until: >-
    _cilium_ready.rc == 0 and
    (_cilium_ready.stdout | default('0') | int) >= (groups['k3s_servers'] | length)
  retries: "{{ cilium_ready_retries }}"
  delay: "{{ cilium_ready_delay }}"
  changed_when: false
  when: is_first_server | bool

# No jsonpath filter expression. A filter needs nested quotes that do not
# survive Ansible's command module -- the same trap that broke the equivalent
# assertion in the k3s-server role. `kubectl get nodes` prints STATUS in
# column 2, so counting "Ready" lines is equivalent and has no quoting hazard.
- name: Wait for every node to report Ready
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl get nodes --no-headers | awk '{print $2}' | grep -c '^Ready$'
    executable: /bin/bash
  register: _nodes_ready
  until: >-
    _nodes_ready.rc == 0 and
    (_nodes_ready.stdout | trim | int) >= (groups['k3s_servers'] | length)
  retries: 30
  delay: 10
  changed_when: false
  when: is_first_server | bool

# Gate 11 (baseline observability): cluster-wide Hubble flow visibility.
# Runs only once Cilium itself is confirmed healthy above, so this never
# races an in-progress MTU/API-host-drift upgrade.
- name: Check whether hubble-relay is already enabled
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} get deployment hubble-relay -o jsonpath={.metadata.name}
  register: _hubble_relay_deploy
  changed_when: false
  failed_when: false
  when:
    - is_first_server | bool
    - cilium_hubble_relay_enabled | bool

- name: Capture the Cilium DaemonSet pod template before enabling Hubble relay (safety baseline)
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} get daemonset cilium -o jsonpath={.spec.template}
  register: _ds_template_before
  changed_when: false
  when:
    - is_first_server | bool
    - cilium_hubble_relay_enabled | bool
    - _hubble_relay_deploy.stdout | default('') == ''

- name: Enable Hubble relay
  ansible.builtin.command:
    cmd: >-
      {{ cilium_cli_bin }} upgrade
      --namespace {{ cilium_namespace }}
      --reuse-values
      --set hubble.relay.enabled=true
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
      --set MTU={{ cilium_mtu }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: _hubble_upgrade
  changed_when: _hubble_upgrade.rc == 0
  timeout: "{{ cilium_install_timeout }}"
  when:
    - is_first_server | bool
    - cilium_hubble_relay_enabled | bool
    - _hubble_relay_deploy.stdout | default('') == ''

- name: Read the Cilium DaemonSet pod template after enabling Hubble relay
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} get daemonset cilium -o jsonpath={.spec.template}
  register: _ds_template_after
  changed_when: false
  when: _hubble_upgrade is defined and _hubble_upgrade is changed

# The repository contract prohibits restarting the Cilium DaemonSet without
# root-cause analysis and explicit authorisation (CLAUDE.md Section 9/15).
# hubble-relay is a separate Deployment reading the agent's already-open
# Hubble port (4244); enabling it should never touch the agent DaemonSet's
# own pod spec. This assert is the proof -- if the Helm chart's templating
# changed the DaemonSet spec as a side effect, stop here rather than letting
# kubelet notice the drift and roll it later unsupervised. A failure here
# means: do not proceed: revert hubble.relay.enabled and get separate
# authorisation for the restart.
- name: Assert the Cilium DaemonSet pod template is unchanged after enabling Hubble relay
  ansible.builtin.assert:
    that:
      - _ds_template_before.stdout == _ds_template_after.stdout
    fail_msg: >-
      Enabling hubble.relay.enabled changed the Cilium DaemonSet's pod
      template -- this would cause a Cilium restart, which is prohibited
      without a separate root-cause analysis and explicit authorisation
      (CLAUDE.md Section 9/15). Revert with `cilium upgrade --reuse-values
      --set hubble.relay.enabled=false` and escalate before retrying.
    quiet: true
  when: _hubble_upgrade is defined and _hubble_upgrade is changed

# Gate 11: agent/operator metrics on an EXISTING cluster. Unlike hubble-relay,
# this necessarily rewrites the agent DaemonSet's pod template (it adds a
# metrics port and its config keys), so it rolls every Cilium pod. That is the
# restart CLAUDE.md Sections 9 and 15 prohibit without explicit authorisation,
# which is why it is gated behind cilium_allow_disruptive_upgrade rather than
# firing on a routine converge. A fresh install needs none of this -- the
# install command above already carries the flags.
- name: Check whether Cilium is already exposing metrics
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ cilium_namespace }} get configmap cilium-config -o yaml
      | awk '/^  prometheus-serve-addr:/ {print $2}'
    executable: /bin/bash
  register: _cilium_metrics_addr
  changed_when: false
  when:
    - is_first_server | bool
    - cilium_prometheus_enabled | bool

- name: Report that Cilium metrics need an authorised, disruptive upgrade
  ansible.builtin.debug:
    msg: >-
      Cilium agent metrics are NOT enabled and cilium_allow_disruptive_upgrade
      is false, so this run is leaving it alone. Enabling it rewrites the agent
      DaemonSet pod template and rolls every Cilium pod. Re-run with
      -e cilium_allow_disruptive_upgrade=true only when that restart is
      intended and authorised (CLAUDE.md Sections 9 and 15).
  when:
    - is_first_server | bool
    - cilium_prometheus_enabled | bool
    - (_cilium_metrics_addr.stdout | default('') | trim) == ''
    - not (cilium_allow_disruptive_upgrade | bool)

- name: Enable Cilium agent and operator metrics (DISRUPTIVE - rolls the DaemonSet)
  ansible.builtin.command:
    cmd: >-
      {{ cilium_cli_bin }} upgrade
      --namespace {{ cilium_namespace }}
      --reuse-values
      --set prometheus.enabled=true
      --set operator.prometheus.enabled=true
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
      --set MTU={{ cilium_mtu }}
      --set updateStrategy.rollingUpdate.maxUnavailable={{ cilium_max_unavailable }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: _cilium_metrics_upgrade
  changed_when: _cilium_metrics_upgrade.rc == 0
  timeout: "{{ cilium_install_timeout }}"
  when:
    - is_first_server | bool
    - cilium_prometheus_enabled | bool
    - (_cilium_metrics_addr.stdout | default('') | trim) == ''
    - cilium_allow_disruptive_upgrade | bool

- name: Wait for the Cilium rollout to finish after enabling metrics
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} rollout status daemonset/cilium
      --timeout=600s
  changed_when: false
  when: _cilium_metrics_upgrade is defined and _cilium_metrics_upgrade is changed

- name: Wait for hubble-relay to become ready
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} rollout status deployment/hubble-relay
      --timeout=300s
  changed_when: false
  when: _hubble_upgrade is defined and _hubble_upgrade is changed

# Host firewall. Same shape as the metrics block above and for the same
# reason: it rewrites the agent DaemonSet's pod template and rolls every
# Cilium pod, so it is gated behind cilium_allow_disruptive_upgrade rather
# than firing on a routine converge.
#
# Turning the flag on filters NOTHING by itself -- the host endpoint stays
# default-allow until a CiliumClusterwideNetworkPolicy selects it. See the
# variable's comment in defaults/main.yml for why the restart is deliberately
# taken at this inert stage, and for the lockout warning that applies to
# writing the host policy afterwards.
# Deliberately reads the RUNNING AGENT, not cilium-config. Found live
# 2026-09-17: `cilium upgrade --set hostFirewall.enabled=true` rewrites the
# ConfigMap but does NOT change the agent DaemonSet's pod template, so nothing
# rolls and the agents keep running with the host firewall disabled. Keying
# this check off the ConfigMap made the role report success while the datapath
# was unchanged -- and left the cluster one unrelated pod restart away from
# silently activating the feature at an unpredictable moment. The agent's own
# status is the only honest source for whether this is actually in force.
- name: Check whether the Cilium host firewall is already enabled (runtime, not config)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      pod=$(k3s kubectl -n {{ cilium_namespace }} get pods --no-headers | awk '/^cilium-[a-z0-9]{5}/ {print $1; exit}');
      k3s kubectl -n {{ cilium_namespace }} exec "$pod" -c cilium-agent -- cilium-dbg status 2>/dev/null | awk -F: '/^Host firewall/ {gsub(/ /,"",$2); print tolower($2)}' | cut -d'[' -f1
    executable: /bin/bash
  register: _cilium_hostfw
  changed_when: false
  when:
    - is_first_server | bool
    - cilium_host_firewall_enabled | bool

- name: Report that the Cilium host firewall needs an authorised, disruptive upgrade
  ansible.builtin.debug:
    msg: >-
      The Cilium host firewall is NOT enabled and cilium_allow_disruptive_upgrade
      is false, so this run is leaving it alone. Enabling it rewrites the agent
      DaemonSet pod template and rolls every Cilium pod. Re-run with
      -e cilium_allow_disruptive_upgrade=true only when that restart is
      intended and authorised (CLAUDE.md Sections 9 and 15).
  when:
    - is_first_server | bool
    - cilium_host_firewall_enabled | bool
    - (_cilium_hostfw.stdout | default('') | trim) != 'enabled'
    - not (cilium_allow_disruptive_upgrade | bool)

- name: Enable the Cilium host firewall (DISRUPTIVE - rolls the DaemonSet)
  ansible.builtin.command:
    cmd: >-
      {{ cilium_cli_bin }} upgrade
      --namespace {{ cilium_namespace }}
      --reuse-values
      --set hostFirewall.enabled=true
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
      --set MTU={{ cilium_mtu }}
      --set updateStrategy.rollingUpdate.maxUnavailable={{ cilium_max_unavailable }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: _cilium_hostfw_upgrade
  changed_when: _cilium_hostfw_upgrade.rc == 0
  timeout: "{{ cilium_install_timeout }}"
  when:
    - is_first_server | bool
    - cilium_host_firewall_enabled | bool
    - (_cilium_hostfw.stdout | default('') | trim) != 'enabled'
    - cilium_allow_disruptive_upgrade | bool

# The helm upgrade above only rewrites cilium-config; it leaves the DaemonSet
# pod template untouched, so Kubernetes has nothing to roll and the agents keep
# their old in-process configuration. The restart therefore has to be explicit.
- name: Restart the Cilium DaemonSet so the agents actually read the new config
  ansible.builtin.command:
    cmd: k3s kubectl -n {{ cilium_namespace }} rollout restart daemonset/cilium
  changed_when: true
  when: _cilium_hostfw_upgrade is defined and _cilium_hostfw_upgrade is changed

- name: Wait for the Cilium rollout to finish after enabling the host firewall
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ cilium_namespace }} rollout status daemonset/cilium
      --timeout=600s
  changed_when: false
  when: _cilium_hostfw_upgrade is defined and _cilium_hostfw_upgrade is changed

- name: Assert the running agent now actually reports the host firewall enabled
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      pod=$(k3s kubectl -n {{ cilium_namespace }} get pods --no-headers | awk '/^cilium-[a-z0-9]{5}/ {print $1; exit}');
      k3s kubectl -n {{ cilium_namespace }} exec "$pod" -c cilium-agent -- cilium-dbg status 2>/dev/null | awk -F: '/^Host firewall/ {gsub(/ /,"",$2); print tolower($2)}' | cut -d'[' -f1
    executable: /bin/bash
  register: _cilium_hostfw_after
  changed_when: false
  failed_when: (_cilium_hostfw_after.stdout | default('') | trim) != 'enabled'
  when: _cilium_hostfw_upgrade is defined and _cilium_hostfw_upgrade is changed

- name: Assert no host policy is silently in force after enabling the host firewall
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl get ciliumclusterwidenetworkpolicies -o json 2>/dev/null
      | grep -c '"nodeSelector"' || true
    executable: /bin/bash
  register: _cilium_host_policies
  changed_when: false
  failed_when: (_cilium_host_policies.stdout | default('0') | trim | int) > 0
  when: _cilium_hostfw_upgrade is defined and _cilium_hostfw_upgrade is changed

# Plain grep over YAML rather than jsonpath. jsonpath needs quoting for both
# filter expressions and literal text, and neither survives Ansible's command
# module intact -- this role and k3s-server both hit that trap.
- name: Read the effective Cilium configuration
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n {{ cilium_namespace }} get configmap cilium-config -o yaml
      | grep -E '^  (routing-mode|tunnel-protocol|enable-wireguard|kube-proxy-replacement|enable-ipv4-masquerade|mtu):'
      | tr -d ' '
      | tr '\n' ' '
    executable: /bin/bash
  register: _cilium_cfg
  changed_when: false
  when: is_first_server | bool

- name: Report the effective Cilium configuration
  ansible.builtin.debug:
    msg: "cilium-config: {{ _cilium_cfg.stdout }}"
  when: is_first_server | bool
