[defaults]
inventory = inventory/production/hosts.yml
roles_path = roles
# Gate 1 G01-C4: host keys must match a recorded baseline. Enforced against
# files/known_hosts below, not each operator's own ~/.ssh/known_hosts --
# host_key_checking was False, so nothing ever verified this.
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# UserKnownHostsFile is resolved relative to the current working directory,
# same as `inventory` above -- ansible-playbook must be run from this
# directory (ansible/), not the repo root.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=files/known_hosts -o StrictHostKeyChecking=yes
