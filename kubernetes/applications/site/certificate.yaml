---
# The wildcard certificate Traefik serves on host port 443.
#
# Two identifiers, and both are needed: a wildcard covers exactly one label,
# so *.veridexeai.com matches www.veridexeai.com but NOT the apex. The apex is
# listed separately. Together they cover every hostname the site IngressRoute
# matches today (ingressroute.yaml) and every future subdomain without a
# second issuance.
#
# Both identifiers validate against the SAME DNS-01 record name,
# _acme-challenge.veridexeai.com, as two TXT values in one RRset -- the
# wildcard's challenge is published at the base domain, not under the
# wildcard. That name is already permitted by the committed IAM policy
# (docs/security/route53-iam-policy.json), so no policy change is required.
# Note the consequence: www is covered by the wildcard, so
# _acme-challenge.www.veridexeai.com is never written. The policy permits it;
# nothing uses it.
#
# The Secret is created by cert-manager in this namespace because a Traefik
# IngressRoute can only reference a Secret from its own namespace.
#
# issuerRef is letsencrypt-prod, promoted 2026-09-18 after the staging run
# proved the whole chain: both challenges reached valid, the Certificate went
# Ready, and both worker IPs served a cert-manager certificate whose SAN list
# held *.veridexeai.com and veridexeai.com, matched with SNI
# www.veridexeai.com. Staging evidence:
# docs/evidence/gap-closure/tls-public/build-status.md.
#
# To roll back, put letsencrypt-staging here again: cert-manager reissues into
# the same Secret name and Traefik reloads it without a restart. The rollback
# is untrusted-but-serving, never no-certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: veridexeai-tls
  namespace: site
spec:
  secretName: veridexeai-tls
  commonName: veridexeai.com
  dnsNames:
    - veridexeai.com
    - "*.veridexeai.com"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
