# The four dashboards buildable against metrics that actually exist today
# (docs/architecture/observability-catalogue.md §3): D02 Nodes, D03 Workloads,
# D20 Argo CD, D21 Observability self-health.
#
# Every query here was written against a measured metric family -- 1647 were
# present at authoring time. Dashboards for Longhorn, MinIO, CNPG, NATS,
# Temporal, the document pipeline and the rest are deliberately NOT here:
# their services do not exist yet, and a panel that can only ever render
# "No data" erodes trust in the panels that carry real signal. Each ships
# with the gate that creates its subject.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-dashboards
  namespace: monitoring
data:
  d02-nodes.json: |
    {
      "editable":false,"graphTooltip":1,"refresh":"30s","schemaVersion":41,
      "tags":["veridex","nodes","D02"],"timezone":"browser",
      "title":"D02 Netcup Nodes and Capacity","uid":"veridex-d02-nodes","version":1,
      "time":{"from":"now-6h","to":"now"},
      "templating":{"list":[{"name":"node","type":"query","datasource":{"type":"prometheus","uid":"victoriametrics"},"query":{"query":"label_values(node_uname_info, instance)"},"includeAll":true,"multi":true,"current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"stat","title":"node-exporter targets up","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":5}]}}},"targets":[{"refId":"A","expr":"sum(up{job=\"node-exporter\"})"}]},
        {"id":2,"type":"stat","title":"Nodes Ready","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":6,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":5}]}}},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}]},
        {"id":3,"type":"stat","title":"Max root filesystem used","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.8},{"color":"red","value":0.9}]}}},"targets":[{"refId":"A","expr":"max(1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"})"}]},
        {"id":4,"type":"stat","title":"Min memory available","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":18,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"yellow","value":0.15},{"color":"green","value":0.25}]}}},"targets":[{"refId":"A","expr":"min(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)"}]},
        {"id":5,"type":"timeseries","title":"CPU utilisation by node","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":4,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percentunit","max":1,"min":0}},"targets":[{"refId":"A","legendFormat":"{{instance}}","expr":"1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"$node\"}[5m]))"}]},
        {"id":6,"type":"timeseries","title":"CPU steal — hypervisor withholding CPU","description":"On virtual servers this is the signal that the host is not giving the guest the CPU it asked for. Kubernetes sees capacity that is not really there.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":4,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percentunit","min":0}},"targets":[{"refId":"A","legendFormat":"{{instance}}","expr":"avg by (instance) (rate(node_cpu_seconds_total{mode=\"steal\",instance=~\"$node\"}[5m]))"}]},
        {"id":7,"type":"timeseries","title":"Memory available by node","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":12,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"bytes"}},"targets":[{"refId":"A","legendFormat":"{{instance}} available","expr":"node_memory_MemAvailable_bytes{instance=~\"$node\"}"}]},
        {"id":8,"type":"timeseries","title":"Filesystem used by mountpoint","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":12,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percentunit","max":1,"min":0}},"targets":[{"refId":"A","legendFormat":"{{instance}} {{mountpoint}}","expr":"1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\",instance=~\"$node\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\",instance=~\"$node\"}"}]},
        {"id":9,"type":"timeseries","title":"Disk I/O latency (avg seconds per op)","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":20,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","legendFormat":"{{instance}} {{device}} read","expr":"rate(node_disk_read_time_seconds_total{instance=~\"$node\"}[5m]) / clamp_min(rate(node_disk_reads_completed_total{instance=~\"$node\"}[5m]), 1)"},{"refId":"B","legendFormat":"{{instance}} {{device}} write","expr":"rate(node_disk_write_time_seconds_total{instance=~\"$node\"}[5m]) / clamp_min(rate(node_disk_writes_completed_total{instance=~\"$node\"}[5m]), 1)"}]},
        {"id":10,"type":"timeseries","title":"Network errors and drops","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":20,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"pps"}},"targets":[{"refId":"A","legendFormat":"{{instance}} {{device}} rx errs","expr":"rate(node_network_receive_errs_total{instance=~\"$node\"}[5m])"},{"refId":"B","legendFormat":"{{instance}} {{device}} tx errs","expr":"rate(node_network_transmit_errs_total{instance=~\"$node\"}[5m])"},{"refId":"C","legendFormat":"{{instance}} {{device}} rx drop","expr":"rate(node_network_receive_drop_total{instance=~\"$node\"}[5m])"}]},
        {"id":11,"type":"timeseries","title":"Load average (1m) vs CPU count","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":28,"w":12,"h":7},"targets":[{"refId":"A","legendFormat":"{{instance}} load1","expr":"node_load1{instance=~\"$node\"}"},{"refId":"B","legendFormat":"{{instance}} cpus","expr":"count by (instance) (node_cpu_seconds_total{mode=\"idle\",instance=~\"$node\"})"}]},
        {"id":12,"type":"timeseries","title":"Conntrack utilisation","description":"Rising conntrack use has already differed 4x between agent nodes on this cluster; worth watching as workloads land.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":28,"w":12,"h":7},"fieldConfig":{"defaults":{"unit":"percentunit","min":0}},"targets":[{"refId":"A","legendFormat":"{{instance}}","expr":"node_nf_conntrack_entries{instance=~\"$node\"} / clamp_min(node_nf_conntrack_entries_limit{instance=~\"$node\"}, 1)"}]}
      ]
    }
  d03-workloads.json: |
    {
      "editable":false,"graphTooltip":1,"refresh":"30s","schemaVersion":41,
      "tags":["veridex","kubernetes","D03"],"timezone":"browser",
      "title":"D03 Kubernetes Workloads and Scheduling","uid":"veridex-d03-workloads","version":1,
      "time":{"from":"now-6h","to":"now"},
      "templating":{"list":[{"name":"namespace","type":"query","datasource":{"type":"prometheus","uid":"victoriametrics"},"query":{"query":"label_values(kube_pod_info, namespace)"},"includeAll":true,"multi":true,"current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"stat","title":"Pods not Running","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}}},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase!=\"Running\",phase!=\"Succeeded\",namespace=~\"$namespace\"})"}]},
        {"id":2,"type":"stat","title":"Pods Pending","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":6,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase=\"Pending\",namespace=~\"$namespace\"})"}]},
        {"id":3,"type":"stat","title":"CPU requests vs allocatable","description":"The failure mode to watch: requests can exceed allocatable while actual use stays low, so idle hardware looks schedulable and is not.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.75},{"color":"red","value":0.85}]}}},"targets":[{"refId":"A","expr":"sum(kube_pod_container_resource_requests{resource=\"cpu\",unit=\"core\"}) / clamp_min(sum(kube_node_status_allocatable{resource=\"cpu\",unit=\"core\"}), 1)"}]},
        {"id":4,"type":"stat","title":"Memory requests vs allocatable","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":18,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":0.75},{"color":"red","value":0.85}]}}},"targets":[{"refId":"A","expr":"sum(kube_pod_container_resource_requests{resource=\"memory\",unit=\"byte\"}) / clamp_min(sum(kube_node_status_allocatable{resource=\"memory\",unit=\"byte\"}), 1)"}]},
        {"id":5,"type":"timeseries","title":"CPU: actual vs requests vs limits by namespace","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":4,"w":12,"h":9},"fieldConfig":{"defaults":{"unit":"cores"}},"targets":[{"refId":"A","legendFormat":"{{namespace}} actual","expr":"sum by (namespace) (veridex:container_cpu_usage_cores:rate5m{namespace=~\"$namespace\"})"},{"refId":"B","legendFormat":"{{namespace}} request","expr":"veridex:namespace_cpu_requests_cores{namespace=~\"$namespace\"}"},{"refId":"C","legendFormat":"{{namespace}} limit","expr":"veridex:namespace_cpu_limits_cores{namespace=~\"$namespace\"}"}]},
        {"id":6,"type":"timeseries","title":"Memory: working set vs requests vs limits","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":4,"w":12,"h":9},"fieldConfig":{"defaults":{"unit":"bytes"}},"targets":[{"refId":"A","legendFormat":"{{namespace}} working set","expr":"sum by (namespace) (veridex:container_memory_working_set_bytes{namespace=~\"$namespace\"})"},{"refId":"B","legendFormat":"{{namespace}} request","expr":"veridex:namespace_memory_requests_bytes{namespace=~\"$namespace\"}"},{"refId":"C","legendFormat":"{{namespace}} limit","expr":"veridex:namespace_memory_limits_bytes{namespace=~\"$namespace\"}"}]},
        {"id":7,"type":"timeseries","title":"Container restarts (rate over 15m)","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":13,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{namespace}}/{{pod}}/{{container}}","expr":"increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[15m]) > 0"}]},
        {"id":8,"type":"timeseries","title":"CPU throttling ratio by container","description":"Throttling means the workload wanted CPU its limit denied. The source platform ran CNPG throttled at a 100m request; this is the panel that would have shown it.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":13,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percentunit","min":0}},"targets":[{"refId":"A","legendFormat":"{{namespace}}/{{pod}}/{{container}}","expr":"veridex:container_cpu_throttled_ratio:rate5m{namespace=~\"$namespace\"} > 0"}]},
        {"id":9,"type":"timeseries","title":"Deployment replicas: desired vs available","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":21,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{namespace}}/{{deployment}} desired","expr":"kube_deployment_spec_replicas{namespace=~\"$namespace\"}"},{"refId":"B","legendFormat":"{{namespace}}/{{deployment}} available","expr":"kube_deployment_status_replicas_available{namespace=~\"$namespace\"}"}]},
        {"id":10,"type":"timeseries","title":"Pods by node","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":21,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{node}}","expr":"count by (node) (kube_pod_info{namespace=~\"$namespace\"})"}]}
      ]
    }
  d20-argocd.json: |
    {
      "editable":false,"graphTooltip":1,"refresh":"30s","schemaVersion":41,
      "tags":["veridex","gitops","D20"],"timezone":"browser",
      "title":"D20 Argo CD and GitOps","uid":"veridex-d20-argocd","version":1,
      "time":{"from":"now-6h","to":"now"},
      "panels":[
        {"id":1,"type":"stat","title":"Applications Synced","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":0,"w":6,"h":4},"targets":[{"refId":"A","expr":"sum(argocd_app_info{sync_status=\"Synced\"})"}]},
        {"id":2,"type":"stat","title":"Applications NOT Synced","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":6,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"targets":[{"refId":"A","expr":"sum(argocd_app_info{sync_status!=\"Synced\"})"}]},
        {"id":3,"type":"stat","title":"Applications Healthy","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":0,"w":6,"h":4},"targets":[{"refId":"A","expr":"sum(argocd_app_info{health_status=\"Healthy\"})"}]},
        {"id":4,"type":"stat","title":"Applications Degraded","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":18,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"targets":[{"refId":"A","expr":"sum(argocd_app_info{health_status=\"Degraded\"})"}]},
        {"id":5,"type":"table","title":"Applications — sync and health","description":"The expected inventory is this cluster's own, derived from gitops/. Do not carry over the source platform's count.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":4,"w":24,"h":8},"targets":[{"refId":"A","format":"table","instant":true,"expr":"argocd_app_info"}]},
        {"id":6,"type":"timeseries","title":"Sync status over time","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":12,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{name}} {{sync_status}}","expr":"argocd_app_info"}]},
        {"id":7,"type":"timeseries","title":"Application reconciliation rate","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":12,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"reqps"}},"targets":[{"refId":"A","legendFormat":"{{namespace}}","expr":"sum by (namespace) (rate(argocd_app_reconcile_count[5m]))"}]},
        {"id":8,"type":"timeseries","title":"Controller workqueue depth","description":"A rising queue means the controller cannot keep up; a flat non-zero queue with no reconciliation usually means it is wedged.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":20,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{name}}","expr":"workqueue_depth{job=\"argocd\"}"}]},
        {"id":9,"type":"timeseries","title":"Git / repo-server request failures","description":"Repo-server unavailability has already stopped reconciliation on this cluster once; this is the leading indicator.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":20,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{request_type}}","expr":"sum by (request_type) (rate(argocd_git_request_total[5m]))"}]}
      ]
    }
  d21-observability.json: |
    {
      "editable":false,"graphTooltip":1,"refresh":"30s","schemaVersion":41,
      "tags":["veridex","observability","D21"],"timezone":"browser",
      "title":"D21 Observability Stack Health","uid":"veridex-d21-observability","version":1,
      "time":{"from":"now-6h","to":"now"},
      "panels":[
        {"id":1,"type":"stat","title":"Scrape targets DOWN","description":"The monitoring system must monitor itself. A down target means a blind spot, not a quiet system.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"targets":[{"refId":"A","expr":"count(up == 0) or vector(0)"}]},
        {"id":2,"type":"stat","title":"Active time series","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":6,"y":0,"w":6,"h":4},"targets":[{"refId":"A","expr":"sum(vm_cache_entries{type=\"storage/hour_metric_ids\"})"}]},
        {"id":3,"type":"stat","title":"Alerts firing","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":0,"w":6,"h":4},"targets":[{"refId":"A","expr":"sum(vmalert_alerts_firing) or vector(0)"}]},
        {"id":4,"type":"stat","title":"Rule evaluation errors","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":18,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}},"targets":[{"refId":"A","expr":"sum(increase(vmalert_execution_errors_total[1h])) or vector(0)"}]},
        {"id":5,"type":"timeseries","title":"Scrape target up/down by job","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":4,"w":12,"h":8},"fieldConfig":{"defaults":{"max":1,"min":0}},"targets":[{"refId":"A","legendFormat":"{{job}}","expr":"min by (job) (up)"}]},
        {"id":6,"type":"timeseries","title":"Scrape duration by job","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":4,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","legendFormat":"{{job}}","expr":"max by (job) (scrape_duration_seconds)"}]},
        {"id":7,"type":"timeseries","title":"vmagent remote-write: rate and errors","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":12,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"blocks sent","expr":"sum(rate(vmagent_remotewrite_requests_total[5m]))"},{"refId":"B","legendFormat":"errors","expr":"sum(rate(vmagent_remotewrite_errors_total[5m])) or vector(0)"}]},
        {"id":8,"type":"timeseries","title":"vmagent pending remote-write data","description":"A queue that only grows means VictoriaMetrics is not accepting writes; samples are buffered and will eventually be dropped.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":12,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"bytes"}},"targets":[{"refId":"A","legendFormat":"pending bytes","expr":"sum(vmagent_remotewrite_pending_data_bytes) or vector(0)"}]},
        {"id":9,"type":"timeseries","title":"VictoriaMetrics storage size on disk","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":20,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"bytes"}},"targets":[{"refId":"A","legendFormat":"{{type}}","expr":"sum by (type) (vm_data_size_bytes)"}]},
        {"id":10,"type":"timeseries","title":"Ingestion rate (rows/s)","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":20,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"rows inserted","expr":"sum(rate(vm_rows_inserted_total[5m]))"}]},
        {"id":11,"type":"timeseries","title":"vmalert rule evaluation duration","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":0,"y":28,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"refId":"A","legendFormat":"{{group}}","expr":"max by (group) (vmalert_iteration_duration_seconds)"}]},
        {"id":12,"type":"timeseries","title":"Alertmanager notifications and failures","description":"Scraped since the catalogue review found alertmanager_* entirely absent from storage -- a silently undelivering Alertmanager was not itself alertable.","datasource":{"type":"prometheus","uid":"victoriametrics"},"gridPos":{"x":12,"y":28,"w":12,"h":8},"targets":[{"refId":"A","legendFormat":"{{integration}} sent","expr":"sum by (integration) (rate(alertmanager_notifications_total[5m])) or vector(0)"},{"refId":"B","legendFormat":"{{integration}} failed","expr":"sum by (integration) (rate(alertmanager_notifications_failed_total[5m])) or vector(0)"}]}
      ]
    }
