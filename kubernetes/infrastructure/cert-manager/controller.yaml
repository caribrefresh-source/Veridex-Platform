# cert-manager v1.21.2 -- VENDORED, DO NOT HAND-EDIT.
#
# Source:  https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
# sha256:  e03b668ec8675214af6b0a671699d088f2601fa3878e0dbe1b41d3feafd1879f
# Fetched and split 2026-09-16. Re-download that exact URL and re-split to
# reproduce this file; the sha256 above is of the upstream file as downloaded,
# before splitting.
#
# v1.21.2 rather than the v1.20.4 patch published the same week: v1.20.4's own
# release notes state three golang.org/x/crypto findings remain unfixed in the
# 1.20 line and direct users to 1.21 for a clean scan. 1.21.2 also carries ACME
# fixes that sit directly in this cluster's path -- a renewal-window bug on
# 29 February cron schedules, ACME response bodies capped against unbounded-body
# DoS, and ACME response content no longer copied into Issuer status or Events.
#
# Two deliberate changes from upstream:
#   1. The Namespace object is removed. It is declared once, in
#      kubernetes/cluster/namespaces/cert-manager.yaml, so exactly one Argo CD
#      path owns it (CLAUDE.md §13).
#   2. All four images are pinned by digest as well as tag -- a tag can move, a
#      digest cannot. Digests read from quay.io's registry API on 2026-09-16.
#      cert-manager-acmesolver is pinned even though DNS-01 never pulls it, so
#      that adding an HTTP-01 solver later cannot silently introduce a floating
#      tag.
#
# This release ships no startupapicheck Job, so there is none to remove.
#
# Controller, webhook, cainjector, their RBAC, Services and webhook
# configurations. Applied after crds.yaml (sync-wave 1 vs 0): the CRDs must
# exist before anything references them.
