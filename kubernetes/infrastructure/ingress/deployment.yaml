---
# Traefik v3.7.13, image digest-pinned (not just tag-pinned -- a tag can move,
# a digest cannot). Digest verified directly against Docker Hub's registry
# API for the linux/amd64 manifest on 2026-09-15, matching this cluster's
# node architecture.
#
# Scope note: this deployment originally existed only to make Argo CD
# reachable over HTTPS, on one entrypoint (websecure, TLS passthrough),
# watching IngressRouteTCP objects in the argocd namespace only. Grafana is
# now a second consumer: a dedicated grafana-https entrypoint (its own
# NodePort, kubernetes/infrastructure/ingress/service.yaml) keeps it fully
# separate from Argo CD's TLS-passthrough catch-all (HostSNI(`*`) on
# websecure) rather than trying to share that entrypoint -- there is no real
# hostname yet for either service (raw-IP access), so SNI-based routing
# between them on one entrypoint isn't workable. Grafana doesn't terminate
# its own TLS (unlike Argo CD), so this entrypoint terminates TLS itself
# using Traefik's default self-signed certificate (the monitoring
# namespace's IngressRoute sets tls: {} with no secretName) -- no real
# domain exists for a trusted cert; browsers will warn. Widening further is
# still real future work for whenever another service needs exposing.
#
# Named grafana-https, not grafana-websecure: Kubernetes port names cap at
# 15 characters (IANA_SVC_NAME) and the longer form failed live validation
# ("spec.ports[1].targetPort: ... must be no more than 15 characters").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      containers:
        - name: traefik
          image: "traefik:v3.7.13@sha256:96780238b1bbda5a9bb997f4307ce69e798ad1cf6eb7f2dcc0a440823467d199"
          args:
            - --entrypoints.websecure.address=:8443
            - --entrypoints.grafana-https.address=:8444
            - --providers.kubernetescrd
            - --providers.kubernetescrd.namespaces=argocd,monitoring
            - --ping=true
            - --log.level=INFO
            - --api.dashboard=false
            - --api.insecure=false
            # Prometheus metrics on their own entrypoint, bound to a port that
            # is NOT published by the NodePort Service and NOT opened in the
            # firewall -- reachable only from inside the cluster, by vmagent.
            # addRoutersLabels/addServicesLabels give per-route and per-service
            # request counts and durations, which is what D06 needs; entryPoint
            # labels alone would only show totals.
            - --metrics.prometheus=true
            - --metrics.prometheus.entryPoint=metrics
            - --metrics.prometheus.addRoutersLabels=true
            - --metrics.prometheus.addServicesLabels=true
            # 8082, not 9100: node-exporter already owns 9100 on the host
            # network, and reusing the number here would make scrape configs
            # and dashboards needlessly ambiguous even though the two live in
            # different network namespaces and cannot actually collide.
            - --entrypoints.metrics.address=:8082
          ports:
            - name: websecure
              containerPort: 8443
            - name: grafana-https
              containerPort: 8444
            - name: ping
              containerPort: 8080
            - name: metrics
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Sized from this cluster's own measured utilization (8-18% CPU,
            # 44-68% RAM on 4 vCPU / 8 GiB nodes), not a generic default --
            # Traefik proxying a single low-traffic service needs very little.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
