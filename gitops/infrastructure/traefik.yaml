---
# Makes Argo CD (and later, other services) reachable over HTTPS from
# outside the private vLAN. Pinned Traefik v3.7.13
# (kubernetes/infrastructure/ingress/), GitOps-managed like everything else
# under gitops/ -- unlike Cilium/CoreDNS, Traefik has no bootstrap circular
# dependency on Argo CD (see docs/security/cilium-coredns-ownership.md for
# why those two stay Ansible-owned; Traefik does not need that exception).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: veridex
  source:
    repoURL: https://github.com/caribrefresh-source/Veridex-Platform.git
    targetRevision: main
    # `directory: {recurse: false}` removed 2026-09-15: recurse defaults to
    # false, and because false is the zero value the API server drops the
    # whole `directory` key from the stored object. Git had the key, the live
    # object did not, so root (the app-of-apps) saw a diff it could never
    # resolve -- it sat permanently OutOfSync and stopped applying anything
    # new, including the Gate 11 monitoring Application.
    path: kubernetes/infrastructure/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
