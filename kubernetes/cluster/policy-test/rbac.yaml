---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: policy-test
  namespace: veridex-policy-test
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["policy-test-public"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-test
  namespace: veridex-policy-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: policy-test
subjects:
  - kind: ServiceAccount
    name: policy-test
    namespace: veridex-policy-test
